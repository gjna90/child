<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>운영자 화면</title>
<style>
/* 운영자(관리자) 전용 화면. 로그인한 관리자만 자료를 볼 수 있음 — 막는 일은 DB 접근 규칙(RLS)이 하고, 이 화면은 보여 주기만 한다 */
:root {
  --bg: #f4f6f2; --surface: #ffffff; --ink: #1d2925; --muted: #5d6b65; --line: #d6ddd7;
  --accent: #0e6a62; --accent-ink: #ffffff; --bar: #0e6a62; --track: #e6ece4;
  --warn-bg: #fff4dc; --warn-ink: #7a4b00; --sel: #e2f2ea;
  --font: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #141a18; --surface: #1c2421; --ink: #e8eeeb; --muted: #a3b1ab; --line: #34413c; --accent: #4fb3a8; --accent-ink: #0b1513; --bar: #4fb3a8; --track: #26302c; --warn-bg: #3a2e14; --warn-ink: #f2cf8a; --sel: #1f3a32; }
}
:root[data-theme="dark"] { --bg: #141a18; --surface: #1c2421; --ink: #e8eeeb; --muted: #a3b1ab; --line: #34413c; --accent: #4fb3a8; --accent-ink: #0b1513; --bar: #4fb3a8; --track: #26302c; --warn-bg: #3a2e14; --warn-ink: #f2cf8a; --sel: #1f3a32; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--font); }
main { max-width: 1180px; margin: 0 auto; padding: 16px; display: grid; gap: 14px; }
header { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
h1 { font-size: 1.25rem; margin: 0; } h2 { font-size: 1.05rem; margin: 0 0 8px; } h3 { font-size: .95rem; margin: 10px 0 4px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; min-width: 0; }
.grid2 { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
.tiles { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.tile b { display: block; font-size: 1.6rem; font-variant-numeric: tabular-nums; }
.tile span { color: var(--muted); font-size: .85rem; }
.small { font-size: .85rem; } .muted { color: var(--muted); }
.btn { font: inherit; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; min-height: 36px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { border-color: #b3261e; color: #b3261e; }
input, select { font: inherit; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); min-height: 36px; max-width: 100%; }
form.login { display: grid; gap: 8px; max-width: 360px; }
.warn { background: var(--warn-bg); color: var(--warn-ink); padding: 8px 10px; border-radius: 8px; }
.tablewrap { overflow-x: auto; }
main > *, .grid2 > *, .tiles > * { min-width: 0; }
td.wrap { white-space: normal; min-width: 11em; }
.grid2 { grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { color: var(--muted); font-weight: 500; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tbody tr.click { cursor: pointer; } tbody tr.click:hover, tbody tr.sel { background: var(--sel); }
.bars { display: grid; gap: 6px; }
.bar { display: grid; grid-template-columns: minmax(90px, 38%) 1fr 3.2em; gap: 8px; align-items: center; font-size: .9rem; }
.bar .tr { background: var(--track); border-radius: 4px; height: 14px; position: relative; }
.bar .fl { position: absolute; inset: 0 auto 0 0; background: var(--bar); border-radius: 0 4px 4px 0; min-width: 2px; }
.bar .v { text-align: right; font-variant-numeric: tabular-nums; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
.detail ul { margin: 0; padding-left: 1.1rem; }
.chips span { display: inline-block; border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; margin: 2px 4px 2px 0; font-size: .85rem; }
@media (max-width: 560px) { .bar { grid-template-columns: minmax(80px, 42%) 1fr 2.6em; } }
</style>
</head>
<body>
<main>
  <header><h1>운영자 화면 <span class="small muted">· 테스트판</span></h1><div id="who" class="small"></div></header>
  <div id="app"><div class="panel">불러오는 중…</div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const WEB = null;
// 교육 특징 분류 규칙 (규칙 설명: docs/09_교육특징_분류.md)
// 유치원 '교육과정 운영계획' 글에서 교육 방향을 나타내는 표현을 세어 7가지 방향으로 나눈다.
// - 자동 분류는 '글에 얼마나 자주·어디에 나왔나'만 본다. 실제 운영은 상담·참관으로 확인.
// - 사람이 읽고 정리한 값(data/profiles/curated_2026.js)이 있으면 그것을 먼저 쓴다.

/** 교육 방향 7가지 — 화면·추천에서 같은 키를 쓴다 */
const STYLES = {
  nature: { label: '자연·생태 체험', short: '자연체험', words: ['숲', '생태', '자연', '텃밭', '흙놀이', '산책', '밧줄놀이', '동식물', '곤충', '환경교육', '생태전환', '바깥놀이', '숲체험', '숲놀이', '사계절'] },
  play: { label: '놀이·프로젝트 (아이 주도)', short: '놀이중심', words: ['유아 주도', '유아주도', '놀이중심', '놀이 중심', '자유놀이', '프로젝트', '놀이주제', '놀이 주제', '몰입', '스스로', '자율'] },
  reading: { label: '독서·말·글(문해)', short: '독서·문해', words: ['독서', '그림책', '책놀이', '책 놀이', '문해', '도서', '동화', '말놀이', '글놀이', '이야기 나누기'] },
  body: { label: '신체·운동', short: '신체·운동', words: ['체육', '신체활동', '체력', '줄넘기', '운동', '달리기', '등반', '모닝', '훌라후프', '대근육', '마라톤'] },
  arts: { label: '예술·표현', short: '예술·표현', words: ['음악', '미술', '동극', '뮤지컬', '국악', '공연', '감상', '댄스', '악기', '극놀이', '예술'] },
  character: { label: '인성·예절', short: '인성·예절', words: ['인성', '예절', '배려', '존중', '효', '기본생활습관', '바른', '인사'] },
  learning: { label: '학습·기초교육 (한글·수·영어·AI)', short: '학습·기초', words: ['한글', '수학', '수 놀이', '수놀이', '영어', '코딩', 'AI', '인공지능', '디지털', '체스', '과학', '초등', '교과', '학습지', '교재'] },
};
const STYLE_KEYS = Object.keys(STYLES);

const norm = (t) => t.replace(/[·․‥…]{2,}/g, ' ').replace(/[ \t]+/g, ' ');
const count = (t, w) => { let n = 0, i = 0; while ((i = t.indexOf(w, i)) >= 0) { n++; i += w.length; } return n; };

/** 중점·특색·역점 교육이 나오는 구간(제목 뒤 400자) — 이 구간의 표현은 3배로 센다 */
function focusSections(text) {
  const t = norm(text);
  const out = [];
  const re = /(중점\s*교육|특색\s*교육|특색\s*사업|역점\s*교육|교육\s*중점)/g;
  let m;
  while ((m = re.exec(t))) {
    const seg = t.slice(m.index, m.index + 400);
    if (/상생발전|차\s*례|\d{1,3}\s*\n\s*\d+\.\s/.test(seg.slice(0, 200))) continue; // 교육청 공통 비전·목차 제외
    out.push(seg);
  }
  return out;
}

/** 바깥놀이·숲 활동 빈도 문장 (예: '바깥놀이 매일 60분 이상', '매주 금요일 숲데이') */
function outdoorLines(text) {
  const t = norm(text).replace(/\n/g, ' ');
  const re = /[^.。▸◦•\-/]{0,30}(?:바깥\s*놀이|숲\s*(?:데이|체험|놀이)|실외\s*놀이)[^.。▸◦•/]{0,30}/g;
  const freq = /(매일|1일\s*\d|하루\s*\d|주\s*\d\s*회|매주|월\s*\d\s*회|매월|\d+\s*분\s*이상|\d\s*시간\s*이상)/;
  const seen = new Set();
  return [...t.matchAll(re)].map((x) => x[0].trim()).filter((s) => freq.test(s) && !seen.has(s) && seen.add(s)).slice(0, 6);
}

/** 운영계획 글 → { scores, tags, outdoor, focusCount } */
function analyzePlan(text) {
  const t = norm(text);
  const focus = focusSections(t).join('\n');
  const scores = {};
  for (const [k, s] of Object.entries(STYLES)) {
    const body = s.words.reduce((a, w) => a + count(t, w), 0);
    const f = s.words.reduce((a, w) => a + count(focus, w), 0);
    scores[k] = Math.round((Math.log1p(body) + 3 * Math.log1p(f)) * 10) / 10;
  }
  const focusCount = focusSections(t).length;
  // 학사일정만 올린 짧은 문서는 분류하지 않음(일정표의 '숲체험' 몇 번으로 방향을 단정하지 않기)
  const enough = t.length >= 8000 && focusCount > 0;
  return { scores, tags: enough ? tagsFromScores(scores) : [], outdoor: outdoorLines(t), focusCount, chars: t.length, note: enough ? null : '교육방침·중점교육이 없는 문서(학사일정 등) — 분류하지 않음' };
}

/** 점수 → 기관 안에서 상대적으로 두드러진 방향(최대 3개)만 '강조' */
function tagsFromScores(scores) {
  const arr = Object.entries(scores).sort((a, b) => b[1] - a[1]);
  const top = arr[0]?.[1] ?? 0;
  if (!top) return [];
  return arr.map(([k, v], i) => ({ key: k, label: STYLES[k].label, level: i < 3 && v >= top * 0.8 ? '강조' : v >= top * 0.5 ? '언급' : '적음', score: v }));
}

/** 아이 설문 답 → 잘 맞을 수 있는 교육 방향 (자체 설문 해석, 진단 아님) */
const SURVEY_STYLE = {
  5: ['body', 'nature'], 6: ['body', 'nature'], // 움직임
  7: ['play'], 8: ['play'], 22: ['play'], 24: ['play'], // 몰입·선택·탐색
  23: ['nature', 'play'], // 직접 해보기
};
function kidStyles(answers) {
  const HIGH = new Set(['자주', '대부분']);
  const hit = {};
  for (const [n, keys] of Object.entries(SURVEY_STYLE)) if (HIGH.has(answers?.[n])) for (const k of keys) (hit[k] ??= []).push(+n);
  return hit; // { play: [7, 22], ... }
}

/** 원하는 방향들과 기관 분류의 맞춤 정도 0~1 (강조 1, 언급 0.5, 적음 0). 분류가 없으면 null */
function styleMatch(tags, wanted) {
  if (!tags?.length || !wanted.length) return null;
  const lv = Object.fromEntries(tags.map((t) => [t.key, t.level]));
  const v = wanted.reduce((a, k) => a + (lv[k] === '강조' ? 1 : lv[k] === '언급' ? 0.5 : 0), 0) / wanted.length;
  return Math.round(v * 100) / 100;
}

// 우리 아이 성향·생활 설문 — 문항과 해석 규칙 (자체 설문 초안. 표준화 검사·진단이 아님)
// 앱 화면(app/template.html), 관리자 화면(public/admin.html)이 같은 코드를 쓴다 (빌드 때 끼워 넣음).
// 서버 검사(supabase/functions/submit)는 문항 번호·답 보기·지원 키만 따로 확인한다 — 문항을 바꾸면 거기도 맞출 것.

const SCALE = ['거의 없음', '가끔', '자주', '대부분', '관찰 기회 없음'];
const HIGH = new Set(['자주', '대부분']);
const LOW = new Set(['거의 없음', '가끔']);
const SUPPORTS = {
  gradual_adapt: { name: '적응 지원', q: '처음 적응 기간에 단계적 등원이나 보호자 동반, 사전 방문이 가능한가요?' },
  transition_notice: { name: '활동 전환 안내', q: '활동을 바꿀 때 미리 알려 주시나요? 하던 놀이를 마무리할 시간을 주시나요?' },
  movement: { name: '움직임 기회', q: '하루에 바깥놀이·신체활동 시간은 얼마나 되고, 앉아서 하는 활동 중 잠깐 움직이거나 쉴 수 있나요?' },
  choice_play: { name: '자유놀이·선택', q: '자유놀이 시간은 하루에 얼마나 되고, 아이가 놀이를 고르고 오래 이어 갈 수 있나요?' },
  quiet_space: { name: '조용한 휴식 공간', q: '시끄럽거나 지칠 때 쉴 수 있는 조용한 공간이 있나요? 참여 방식을 조정해 주시나요?' },
  sensory: { name: '재료·촉감 배려', q: '싫어하는 촉감·재료 활동은 다른 활동을 고를 수 있나요?' },
  small_group: { name: '친구 사귀기 도움', q: '소그룹 활동이 있나요? 처음에 친구와 이어지도록 도와주시나요?' },
  express_help: { name: '도움 요청 살피기', q: '아이가 불편을 말로 잘 표현하지 못할 때 선생님이 어떻게 알아채고 도와주시나요?' },
  conflict: { name: '갈등·감정 지원', q: '친구와 의견이 부딪치면 어떻게 중재하고, 감정 표현을 어떻게 도와주시나요?' },
  retry: { name: '재도전 지원', q: '뜻대로 안 돼서 그만두려 할 때 어떻게 격려하시나요? 결과보다 과정을 말해 주시나요?' },
  presentation: { name: '발표 부담 조정', q: '발표·공연처럼 여러 사람 앞에서 하는 활동은 참여 방식을 조정해 줄 수 있나요?' },
  hands_on: { name: '직접 해보는 활동', q: '설명 위주보다 직접 보고 해보는 활동이 많은 편인가요?' },
};
// type: strength(강점·선호) comfort(편안한 조건) help(도움이 필요한 상황). low: 낮게 답했을 때의 해석(있는 문항만)
const ITEMS = [
  [1, '새로운 장소에서 먼저 지켜본 뒤 참여한다.', 'comfort', '새 장소에서는 먼저 지켜볼 시간이 있으면 편안해한다', 'gradual_adapt'],
  [2, '낯선 어른과 있을 때 보호자 가까이에 머무르려 한다.', 'help', '낯선 어른과 있을 때 보호자 곁을 찾는다 — 익숙해질 시간이 필요할 수 있다', 'gradual_adapt'],
  [3, '보호자와 헤어진 뒤 익숙한 어른의 도움을 받아 놀이한다.', 'strength', '헤어진 뒤 익숙한 어른의 도움으로 놀이를 이어 간다', 'gradual_adapt'],
  [4, '새로운 활동을 미리 설명하면 참여하기 수월해진다.', 'comfort', '새 활동을 미리 설명해 주면 참여가 수월하다', 'transition_notice'],
  [5, '달리기·오르기 등 움직이는 놀이를 스스로 찾는다.', 'strength', '몸을 움직이는 놀이를 스스로 찾는다', 'movement'],
  [6, '앉아서 하는 활동 중 움직이거나 쉬고 싶어 한다.', 'help', '앉아서 하는 활동 중에 움직이거나 쉴 기회가 필요하다', 'movement'],
  [7, '좋아하는 놀이를 오래 이어가려 한다.', 'strength', '좋아하는 놀이에 오래 몰입한다', 'choice_play'],
  [8, '여러 활동 중 자신이 할 활동을 고르려 한다.', 'strength', '할 활동을 스스로 고르려 한다', 'choice_play'],
  [9, '놀이가 갑자기 끝나면 불편함을 표현한다.', 'help', '놀이가 갑자기 끝나면 힘들어한다', 'transition_notice'],
  [10, '전환을 미리 알려주면 다음 활동으로 이동하기 수월하다.', 'comfort', '다음 활동을 미리 알려 주면 옮겨 가기 수월하다', 'transition_notice'],
  [11, '소리나 사람이 많은 공간에서 물러나거나 쉬려 한다.', 'help', '소리나 사람이 많은 곳에서는 물러나 쉬려 한다', 'quiet_space'],
  [12, '특정 촉감이나 재료의 활동을 피한다.', 'help', '특정 촉감이나 재료를 피한다', 'sensory'],
  [13, '단체활동 후 조용한 곳에서 쉬려 한다.', 'comfort', '단체활동 뒤 조용히 쉬면 회복한다', 'quiet_space'],
  [14, '휴식 후 다시 활동에 참여한다.', 'strength', '쉬고 나면 다시 활동에 참여한다', 'quiet_space'],
  [15, '처음 만난 또래보다 익숙한 한두 명과 먼저 놀이한다.', 'comfort', '익숙한 한두 명과 먼저 놀며 시작한다', 'small_group'],
  [16, '놀이에 참여할 때 어른의 소개나 도움을 활용한다.', 'comfort', '어른의 소개·도움이 있으면 놀이에 들어가기 쉽다', 'small_group'],
  [17, '불편하거나 도움이 필요할 때 어른에게 표현한다.', 'strength', '불편하거나 도움이 필요할 때 어른에게 말한다', 'express_help', '도움이 필요할 때 표현하는 것을 어른이 먼저 살펴 줄 필요가 있을 수 있다'],
  [18, '친구와 의견이 다를 때 어른의 중재가 필요하다.', 'help', '친구와 의견이 다를 때 어른의 중재가 도움이 된다', 'conflict'],
  [19, '활동이 뜻대로 되지 않으면 그만하려 한다.', 'help', '뜻대로 안 되면 그만두려 한다', 'retry'],
  [20, '과정을 격려하거나 도와주면 다시 시도한다.', 'comfort', '과정을 격려하거나 도와주면 다시 시도한다', 'retry'],
  [21, '여러 사람 앞에서 말하거나 보여주는 활동을 부담스러워한다.', 'help', '여러 사람 앞에서 말하거나 보여 주는 활동을 부담스러워한다', 'presentation'],
  [22, '자신의 방식으로 만들거나 탐색하는 활동을 즐긴다.', 'strength', '자기 방식으로 만들고 탐색하는 것을 즐긴다', 'choice_play'],
  [23, '긴 설명보다 직접 보고 해볼 때 참여하기 수월하다.', 'comfort', '긴 설명보다 직접 보고 해볼 때 수월하다', 'hands_on'],
  [24, '관심 있는 주제로 질문하거나 놀이를 확장한다.', 'strength', '관심 있는 주제로 질문하고 놀이를 넓혀 간다', 'choice_play'],
].map(([n, text, type, hi, sup, lo]) => ({ n, text, type, hi, sup, lo }));

function analyze(rec) {
  const out = { strength: [], comfort: [], help: [], unseen: [], sup: {} };
  for (const it of ITEMS) {
    const a = rec.answers[it.n];
    if (!a) continue;
    if (a === '관찰 기회 없음') { out.unseen.push(it); continue; }
    const note = rec.notes?.[it.n] ? ` (예: ${rec.notes[it.n]})` : '';
    if (HIGH.has(a)) {
      out[it.type].push(it.hi + note);
      if (it.type !== 'strength' || it.sup === 'quiet_space') (out.sup[it.sup] ??= []).push(it.n);
    } else if (it.lo && LOW.has(a)) {
      out.help.push(it.lo + note); (out.sup[it.sup] ??= []).push(it.n);
    }
  }
  return out;
}

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (d) => new Intl.DateTimeFormat('sv-SE', { timeZone: 'Asia/Seoul', dateStyle: 'short', timeStyle: 'short' }).format(new Date(d));
const S = { rows: [], q: '', birth: '', style: '', inst: '', sel: null, msg: '' };
let sb = null;

function bars(list, total) {
  const max = Math.max(1, ...list.map((x) => x[1]));
  return list.length ? `<div class="bars">${list.map(([label, n]) => `<div class="bar" title="${esc(label)}: ${n}명${total ? ` (${Math.round(n / total * 100)}%)` : ''}"><span>${esc(label)}</span><span class="tr"><span class="fl" style="width:${n / max * 100}%"></span></span><span class="v">${n}</span></div>`).join('')}</div>` : '<p class="small muted">자료 없음</p>';
}
const tally = (arr) => { const m = new Map(); for (const k of arr) m.set(k, (m.get(k) ?? 0) + 1); return [...m].sort((a, b) => b[1] - a[1]); };
const styleLabel = (k) => STYLES[k]?.short ?? k;
// 아이 답 → 분석 (앱과 같은 규칙: src/lib/survey.js, src/lib/profile.js)
function derive(r) {
  const an = analyze({ answers: r.answers });
  return { an, styles: Object.keys(kidStyles(r.answers)), needs: Object.keys(an.sup) };
}

async function start() {
  if (!WEB?.url) { $('#app').innerHTML = '<div class="panel warn">아직 서버(Supabase) 설정 전입니다. config/web.json 을 넣고 다시 빌드하면 켜집니다.</div>'; return; }
  sb = supabase.createClient(WEB.url, WEB.key, { auth: { persistSession: true, storageKey: 'kinder-admin' } });
  const { data } = await sb.auth.getSession();
  if (!data.session) return drawLogin();
  await afterLogin(data.session.user);
}
function drawLogin(msg = '') {
  $('#who').textContent = '';
  $('#app').innerHTML = `<div class="panel"><h2>관리자 로그인</h2>
    <form class="login" id="login"><input id="em" type="email" placeholder="이메일" autocomplete="username" required><input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password" required><button class="btn primary">로그인</button>
    ${msg ? `<div class="warn small">${esc(msg)}</div>` : ''}<p class="small muted">관리자로 등록된 계정만 자료를 볼 수 있습니다. 부모 이용자는 로그인하지 않습니다.</p></form></div>`;
  $('#login').onsubmit = async (e) => {
    e.preventDefault();
    const { data, error } = await sb.auth.signInWithPassword({ email: $('#em').value.trim(), password: $('#pw').value });
    if (error) return drawLogin('로그인하지 못했습니다. 이메일·비밀번호를 확인하세요.');
    await afterLogin(data.user);
  };
}
async function afterLogin(user) {
  $('#who').innerHTML = `${esc(user.email)} <button class="btn" id="out">로그아웃</button>`;
  $('#out').onclick = async () => { await sb.auth.signOut(); drawLogin(); };
  const { data: adm } = await sb.from('admins').select('user_id').eq('user_id', user.id).maybeSingle();
  if (!adm) { $('#app').innerHTML = '<div class="panel warn">이 계정은 관리자로 등록되어 있지 않습니다. (SQL의 6번 관리자 등록을 실행하세요)</div>'; return; }
  await load();
}
async function load() {
  const { data, error } = await sb.from('submissions').select('rid,consent_ver,birth_year,observer,answers,picks,plan,reco_styles,created_at,updated_at,expires_at').order('created_at', { ascending: false }).limit(2000);
  if (error) { $('#app').innerHTML = `<div class="panel warn">자료를 불러오지 못했습니다: ${esc(error.message)}</div>`; return; }
  S.rows = data.map((r) => ({ ...r, ...derive(r) }));
  draw();
}

function filtered() {
  const q = S.q.trim().toUpperCase();
  return S.rows.filter((r) => (!q || r.rid.includes(q) || r.plan.some((p) => p.name.toUpperCase().includes(q)))
    && (!S.birth || String(r.birth_year) === S.birth) && (!S.style || r.styles.includes(S.style))
    && (!S.inst || r.plan.some((p) => p.id === S.inst)));
}
function draw() {
  const all = S.rows, rows = filtered(), n = rows.length;
  const week = all.filter((r) => Date.now() - new Date(r.created_at) < 7 * 864e5).length;
  // 기관별 1·2·3지망
  const inst = new Map();
  for (const r of rows) r.plan.forEach((p, i) => { const o = inst.get(p.id) ?? { name: p.name, c: [0, 0, 0] }; o.c[i]++; inst.set(p.id, o); });
  const instRows = [...inst].map(([id, o]) => ({ id, ...o, t: o.c[0] + o.c[1] + o.c[2], score: o.c[0] * 3 + o.c[1] * 2 + o.c[2] })).sort((a, b) => b.score - a.score || b.t - a.t);
  const births = [...new Set(all.map((r) => r.birth_year))].sort();
  const instOpts = [...new Map(all.flatMap((r) => r.plan.map((p) => [p.id, p.name])))].sort((a, b) => a[1].localeCompare(b[1], 'ko'));
  const sel = S.sel && all.find((r) => r.rid === S.sel);
  const filt = S.q || S.birth || S.style || S.inst;
  $('#app').innerHTML = `
  <div class="tiles">
    <div class="tile"><b>${all.length}</b><span>전체 응답</span></div>
    <div class="tile"><b>${week}</b><span>최근 7일</span></div>
    <div class="tile"><b>${all.filter((r) => r.plan.length).length}</b><span>지원할 곳을 고른 응답</span></div>
    <div class="tile"><b>${all.filter((r) => r.observer === '교사').length}</b><span>교사 관찰 응답</span></div>
  </div>
  <div class="panel"><div class="filters">
    <input id="fq" placeholder="응답번호·기관 이름 검색" value="${esc(S.q)}">
    <select id="fb"><option value="">출생연도 전체</option>${births.map((b) => `<option ${String(b) === S.birth ? 'selected' : ''}>${b}</option>`).join('')}</select>
    <select id="fs"><option value="">교육 방향 전체</option>${STYLE_KEYS.map((k) => `<option value="${k}" ${k === S.style ? 'selected' : ''}>${esc(styleLabel(k))}</option>`).join('')}</select>
    <select id="fi"><option value="">지원 기관 전체</option>${instOpts.map(([id, nm]) => `<option value="${esc(id)}" ${id === S.inst ? 'selected' : ''}>${esc(nm)}</option>`).join('')}</select>
    ${filt ? '<button class="btn" id="fclear">조건 지우기</button>' : ''}
    <button class="btn" id="csv">CSV 내려받기</button><button class="btn" id="reload">새로고침</button>
    <span class="small muted">${filt ? `조건에 맞는 응답 ${n}개로 아래 집계` : ''}</span></div>
    ${S.msg ? `<div class="small warn">${esc(S.msg)}</div>` : ''}</div>
  <div class="panel"><h2>기관별 희망 순위 <span class="small muted">(점수 = 1지망 3점 · 2지망 2점 · 3지망 1점)</span></h2>
    <div class="tablewrap"><table><thead><tr><th>기관</th><th class="num">1지망</th><th class="num">2지망</th><th class="num">3지망</th><th class="num">합계</th><th class="num">점수</th></tr></thead>
    <tbody>${instRows.map((o) => `<tr><td>${esc(o.name)}</td>${o.c.map((x) => `<td class="num">${x}</td>`).join('')}<td class="num">${o.t}</td><td class="num">${o.score}</td></tr>`).join('') || '<tr><td colspan="6" class="muted">아직 없음</td></tr>'}</tbody></table></div></div>
  <div class="grid2">
    <div class="panel"><h2>아이에게 맞을 수 있는 교육 방향</h2><p class="small muted" style="margin-top:0">설문 답에서 나온 방향(한 아이가 여러 개 가능). 진단·유형 분류가 아닙니다.</p>${bars(tally(rows.flatMap((r) => r.styles)).map(([k, v]) => [styleLabel(k), v]), n)}</div>
    <div class="panel"><h2>부모가 원하는 교육 방향</h2><p class="small muted" style="margin-top:0">맞춤 추천에서 고른 방향</p>${bars(tally(rows.flatMap((r) => r.reco_styles)).map(([k, v]) => [styleLabel(k), v]), n)}</div>
    <div class="panel"><h2>설문에서 나온 필요한 지원</h2>${bars(tally(rows.flatMap((r) => r.needs)).map(([k, v]) => [SUPPORTS[k]?.name ?? k, v]), n)}</div>
    <div class="panel"><h2>부모가 직접 고른 지원</h2>${bars(tally(rows.flatMap((r) => r.picks)).map(([k, v]) => [SUPPORTS[k]?.name ?? k, v]), n)}</div>
  </div>
  <div class="panel"><h2>문항별 답 분포</h2><div class="tablewrap"><table><thead><tr><th>문항</th>${SCALE.map((s) => `<th class="num">${esc(s)}</th>`).join('')}</tr></thead><tbody>
    ${ITEMS.map((it) => `<tr><td class="wrap" title="${esc(it.text)}">${it.n}. ${esc(it.text.length > 28 ? it.text.slice(0, 28) + '…' : it.text)}</td>${SCALE.map((s) => `<td class="num">${rows.filter((r) => r.answers[it.n] === s).length}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>
  <div class="grid2">
    <div class="panel"><h2>응답 목록 <span class="small muted">${n}개 · 누르면 오른쪽에 자세히</span></h2><div class="tablewrap"><table><thead><tr><th>응답번호</th><th>받은 날</th><th>출생</th><th>관찰</th><th>1지망</th><th>교육 방향</th></tr></thead><tbody>
      ${rows.map((r) => `<tr class="click${r.rid === S.sel ? ' sel' : ''}" data-rid="${esc(r.rid)}"><td>${esc(r.rid)}</td><td>${esc(fmt(r.created_at))}</td><td>${r.birth_year}</td><td>${esc(r.observer)}</td><td>${esc(r.plan[0]?.name ?? '-')}</td><td>${esc(r.styles.map(styleLabel).join(', ') || '-')}</td></tr>`).join('') || '<tr><td colspan="6" class="muted">없음</td></tr>'}</tbody></table></div></div>
    <div class="panel detail" id="detail">${sel ? detail(sel) : '<p class="muted">목록에서 응답을 고르세요.</p>'}</div>
  </div>
  <p class="small muted">보관 기간이 지난 응답(기본 2027-03-31)은 자동으로 지워집니다. 이름·연락처는 받지 않습니다. 이 화면의 자료를 외부에 공유하지 마세요.</p>`;
  bind();
}
function detail(r) {
  const li = (a) => (a.length ? `<ul>${a.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : '<p class="small muted">없음</p>');
  return `<h2>${esc(r.rid)}</h2>
    <div class="small muted">받은 날 ${esc(fmt(r.created_at))}${r.updated_at !== r.created_at ? ` · 바꾼 날 ${esc(fmt(r.updated_at))}` : ''} · 지울 날 ${esc(fmt(r.expires_at))} · 동의 ${esc(r.consent_ver)}</div>
    <div>${r.birth_year}년생 · ${esc(r.observer)} 관찰 · 답 ${Object.keys(r.answers).length}/24</div>
    <h3>지원할 곳 (희망 순서)</h3>${r.plan.length ? `<ol style="margin:0;padding-left:1.3rem">${r.plan.map((p) => `<li>${esc(p.name)}</li>`).join('')}</ol>` : '<p class="small muted">고르지 않음</p>'}
    <h3>교육 방향</h3><div class="chips">아이 설문: ${r.styles.map((k) => `<span>${esc(styleLabel(k))}</span>`).join('') || '-'}<br>부모가 원함: ${r.reco_styles.map((k) => `<span>${esc(styleLabel(k))}</span>`).join('') || '-'}</div>
    <h3>잘하는 점·좋아하는 것</h3>${li(r.an.strength)}
    <h3>편안해하는 조건</h3>${li(r.an.comfort)}
    <h3>도움이 필요할 수 있는 상황</h3>${li(r.an.help)}
    <h3>필요한 지원 (설문) / 부모가 고른 지원</h3><div class="chips">${r.needs.map((k) => `<span>${esc(SUPPORTS[k]?.name ?? k)}</span>`).join('') || '-'}<br>${r.picks.map((k) => `<span>${esc(SUPPORTS[k]?.name ?? k)}</span>`).join('') || '-'}</div>
    <details><summary class="small">문항별 답 보기</summary><table><tbody>${ITEMS.map((it) => `<tr><td class="wrap">${it.n}. ${esc(it.text)}</td><td>${esc(r.answers[it.n] ?? '-')}</td></tr>`).join('')}</tbody></table></details>
    <p><button class="btn danger" id="del">이 응답 지우기</button> <span id="delAsk" class="small"></span></p>`;
}
function bind() {
  const on = (id, ev, fn) => { const el = $(id); if (el) el[ev] = fn; };
  on('#fq', 'oninput', (e) => { S.q = e.target.value; clearTimeout(bind.t); bind.t = setTimeout(() => { draw(); const el = $('#fq'); el.focus(); el.setSelectionRange(el.value.length, el.value.length); }, 250); });
  on('#fb', 'onchange', (e) => { S.birth = e.target.value; draw(); });
  on('#fs', 'onchange', (e) => { S.style = e.target.value; draw(); });
  on('#fi', 'onchange', (e) => { S.inst = e.target.value; draw(); });
  on('#fclear', 'onclick', () => { S.q = S.birth = S.style = S.inst = ''; draw(); });
  on('#reload', 'onclick', () => { S.msg = ''; load(); });
  on('#csv', 'onclick', csv);
  on('#del', 'onclick', delAsk);
  document.querySelectorAll('tr[data-rid]').forEach((tr) => { tr.onclick = () => { S.sel = tr.dataset.rid; draw(); if (innerWidth < 760) $('#detail').scrollIntoView({ behavior: 'smooth' }); }; });
}
function delAsk() {
  $('#delAsk').innerHTML = '되돌릴 수 없습니다. <button class="btn danger" id="delYes">정말 지우기</button>';
  $('#delYes').onclick = async () => {
    const { data, error } = await sb.from('submissions').delete().eq('rid', S.sel).select('rid');
    S.msg = error ? `지우지 못했습니다: ${error.message}` : data?.length ? `${S.sel} 지움` : '지워지지 않았습니다 (권한 확인)';
    S.sel = null; await load();
  };
}
function csv() {
  const head = ['응답번호', '받은날', '출생연도', '관찰자', '1지망', '2지망', '3지망', '아이설문방향', '부모원하는방향', '필요지원', '고른지원', ...ITEMS.map((it) => `Q${it.n}`)];
  const q = (v) => `"${String(v ?? '').replace(/"/g, '""').replace(/^[=+\-@]/, "'$&")}"`;
  const lines = filtered().map((r) => [r.rid, fmt(r.created_at), r.birth_year, r.observer, r.plan[0]?.name, r.plan[1]?.name, r.plan[2]?.name, r.styles.map(styleLabel).join('/'), r.reco_styles.map(styleLabel).join('/'), r.needs.map((k) => SUPPORTS[k]?.name).join('/'), r.picks.map((k) => SUPPORTS[k]?.name).join('/'), ...ITEMS.map((it) => r.answers[it.n] ?? '')].map(q).join(','));
  const blob = new Blob(['﻿' + [head.map(q).join(','), ...lines].join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `설문응답_${new Date().toISOString().slice(0, 10)}.csv`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
start();
</script>
