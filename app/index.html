<style>

:root {

    --road: #3a4642; --road-major: #6b5a36; --road-edge: #26302d; --water: #1f3f52; --park: #22402c; --wood: #1d3a26; --res: #2a302d; --rail: #8f9a95; --label: #c8d4cf;

    --warn-bg: #3a2e14; --warn-ink: #f2cc80; --ok-bg: #173527; --ok-ink: #8fd9b2; --unk-bg: #252d2a; --unk-ink: #9aa9a2;

}

  --bg: #121816; --surface: #1a2220; --ink: #e5ece8; --muted: #9aa9a2; --line: #2e3a36;
  --land: #1e2724; --land-focus: #223a31; --accent: #4fb8a9; --accent-ink: #0b1513;
  --road: #3a4642; --road-major: #6b5a36; --road-edge: #26302d; --water: #1f3f52; --park: #22402c; --wood: #1d3a26; --res: #2a302d; --rail: #8f9a95; --label: #c8d4cf;

* { box-sizing: border-box; }

.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 96px; max-width: 1280px; margin: 0 auto; }

.child { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 12px; }

.layout { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 18px; align-items: start; }
@media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; min-width: 0; }
.stack { display: grid; gap: 14px; min-width: 0; }
.mapbox svg { width: 100%; height: auto; display: block; touch-action: none; cursor: crosshair; border-radius: 8px; background: var(--bg); user-select: none; -webkit-user-select: none; }

.mapctl button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

@media (max-width: 700px) { .mapbox svg { height: min(64vh, 520px); } }
#svgmap .rd { fill: none; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }

.maphead { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: .8rem; color: var(--muted); }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
.btn { font: inherit; font-size: .85rem; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 5px 12px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn:focus-visible, .chip:focus-visible, select:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.filters { display: grid; gap: 10px; }
.fgroup { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.fgroup > .glabel { font-size: .78rem; color: var(--muted); width: 3.6rem; flex: none; letter-spacing: .02em; }
.chip { font: inherit; font-size: .84rem; min-height: 32px; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.chip[aria-pressed="true"]::before { content: "✓ "; }
@media (hover: hover) { .chip[aria-pressed="false"]:hover { border-color: var(--accent); } }
button, .btn, input, select { touch-action: manipulation; }
.rule { font-size: .8rem; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 8px; }
.listhead { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.cards { display: grid; gap: 10px; }
.card { border: 1px solid var(--line); border-radius: var(--r); padding: 12px; background: var(--surface); display: grid; gap: 6px; }
.card.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.card .row1 { display: flex; gap: 8px; align-items: baseline; justify-content: space-between; flex-wrap: wrap; }
.card .name { font-weight: 600; font-size: 1rem; background: none; border: 0; padding: 0; color: var(--ink); cursor: pointer; text-align: left; font-family: inherit; }

.tags { display: flex; flex-wrap: wrap; gap: 4px; }

.tag.pub { background: color-mix(in srgb, var(--public) 16%, transparent); color: var(--public); }
.tag.pri { background: color-mix(in srgb, var(--private) 18%, transparent); color: var(--private); }
.tag.dc { background: color-mix(in srgb, var(--daycare) 18%, transparent); color: var(--daycare); }
.tag.lim { background: var(--warn-bg); color: var(--warn-ink); }
.tag.aca { background: color-mix(in srgb, var(--academy) 18%, transparent); color: var(--academy); }
.state { font-size: .84rem; padding: 2px 8px; border-radius: 6px; display: inline-block; }
.state.ok { background: var(--ok-bg); color: var(--ok-ink); }
.state.warn { background: var(--warn-bg); color: var(--warn-ink); }
.state.unk { background: var(--unk-bg); color: var(--unk-ink); }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 4px 14px; font-size: .84rem; }
.facts div { min-width: 0; }
.facts dt { color: var(--muted); font-size: .74rem; }
.facts dd { margin: 0; }
.card .acts { display: flex; gap: 6px; flex-wrap: wrap; }

.detail { display: grid; gap: 12px; }
.detail section { display: grid; gap: 6px; border-top: 1px solid var(--line); padding-top: 10px; }
.detail ul { margin: 0; padding-left: 1.1rem; }
.src { font-size: .76rem; color: var(--muted); }
.copyrow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: .86rem; }
.copyrow code { font-family: inherit; background: var(--unk-bg); padding: 1px 6px; border-radius: 4px; word-break: break-all; user-select: all; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .84rem; }
th, td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
th { color: var(--muted); font-weight: 500; white-space: nowrap; }
.cmpbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--surface); border-top: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.cmpbar .items { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; min-width: 0; }
.overlay { position: fixed; inset: 0; z-index: 20; background: color-mix(in srgb, var(--ink) 40%, transparent); display: grid; place-items: start center; overflow-y: auto;
  padding: calc(16px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 24px max(12px, env(safe-area-inset-left, 0px)); }
.sheet { background: var(--surface); color: var(--ink); border-radius: 14px; width: min(1000px, 100%); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.sheet .bar { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 14px; overflow-x: auto; }
.tab { font: inherit; font-size: .92rem; background: none; border: 0; border-bottom: 3px solid transparent; padding: 8px 12px; color: var(--muted); cursor: pointer; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.cols2 > * { min-width: 0; }
.cols2 { display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 7fr); gap: 18px; align-items: start; }
@media (max-width: 860px) { .cols2 { grid-template-columns: minmax(0, 1fr); } }
.checks { display: grid; gap: 6px; grid-template-columns: minmax(0, 1fr); }
.checks select { width: 100%; }
.checks label { display: flex; gap: 8px; align-items: flex-start; font-size: .9rem; cursor: pointer; }
.checks input { margin-top: 4px; accent-color: var(--accent); }
.bucket { display: grid; gap: 8px; }
.bucket > h3 { display: flex; gap: 8px; align-items: center; }
.cnt { font-size: .78rem; background: var(--unk-bg); color: var(--unk-ink); border-radius: 999px; padding: 0 8px; font-weight: 500; }
.pickrow { border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; display: grid; gap: 6px; }
.reasons { display: flex; flex-wrap: wrap; gap: 4px; font-size: .78rem; }
.rs { padding: 1px 7px; border-radius: 4px; }
.rs.ok { background: var(--ok-bg); color: var(--ok-ink); }
.rs.no { background: var(--warn-bg); color: var(--warn-ink); }
.rs.unk { background: var(--unk-bg); color: var(--unk-ink); }
.prio { font-size: .86rem; }
.plan { display: grid; gap: 6px; }
.plan ol { margin: 0; padding-left: 1.3rem; }
.qlist { display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; }
.qlist label { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; font-size: .9rem; }
.qlist input { margin-top: 4px; accent-color: var(--accent); }
textarea { font: inherit; width: 100%; min-height: 70px; border: 1px solid var(--line); border-radius: 8px; padding: 8px; background: var(--surface); color: var(--ink); }
.survey { display: grid; gap: 10px; }
.qitem { border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; display: grid; gap: 6px; }

.opts { display: flex; flex-wrap: wrap; gap: 4px; }

.opts input { position: absolute; opacity: 0; width: 1px; height: 1px; }

.qitem input[type="text"], .lifeq input, .lifeq textarea, .kidform input { font: inherit; font-size: .88rem; width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; background: var(--surface); color: var(--ink); }

.crit { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 6px; align-items: center; font-size: .88rem; }

<div class="wrap">
  <header class="top">
    <div>

// 4단계 추천 계산 (명시적 규칙만 사용. AI는 결과 설명에만 씀) — 규칙 문서: docs/07_추천_규칙.md
// 이 파일은 node 테스트와 화면(app) 양쪽에서 쓴다. 화면에는 build-app.js가 export를 지워 끼워 넣는다.
// 값 규칙: 기준별 값은 0~1, 모르면 null. null은 계산에서 빼고 '미확인'으로 표시한다(0으로 바꾸지 않음).

const WEIGHTS = { '매우 중요': 3, 중요: 2, 참고: 1 };
const MIN_COVERAGE = 0.5; // 정보 확인 정도가 이보다 낮으면 '정보 부족' 묶음

/** good일 때 1, bad일 때 0, 사이는 직선. good<bad(작을수록 좋음)·good>bad(클수록 좋음) 모두 지원 */
function linear(x, good, bad) {
  if (x === null || x === undefined || !Number.isFinite(x)) return null;
  if (good === bad) return x === good ? 1 : 0;
  const t = (x - bad) / (good - bad);
  return Math.max(0, Math.min(1, t));
}

/** 비용: 예산의 50% 이하=1, 예산=0.3, 그 사이 직선, 예산 초과=0 (예산 초과는 필수 조건에서 따로 처리) */
function costValue(monthly, budget) {
  if (monthly === null || monthly === undefined || !budget) return null;
  if (monthly <= budget * 0.5) return 1;
  if (monthly > budget) return 0;
  return 1 - 0.7 * ((monthly - budget * 0.5) / (budget * 0.5));
}

/**
 * 종합 비교 지표
 * @param {{key:string, weight:number, value:number|null}[]} crit
 * @returns {{index:number|null, coverage:number, confirmed:number, total:number}}
 *   index = Σ(가중치×값) ÷ Σ(확인된 기준의 가중치) × 100,  coverage = Σ(확인된 가중치) ÷ Σ(전체 가중치)
 */
function composite(crit) {
  const total = crit.reduce((a, c) => a + c.weight, 0);
  const known = crit.filter((c) => c.value !== null && c.value !== undefined);
  const confirmed = known.reduce((a, c) => a + c.weight, 0);
  const index = confirmed ? (known.reduce((a, c) => a + c.weight * c.value, 0) / confirmed) * 100 : null;
  return { index: index === null ? null : Math.round(index * 10) / 10, coverage: total ? confirmed / total : 0, confirmed, total };
}

/** 필수 조건 결과 묶기: 불충족 하나라도 → fail, 아니면 미확인 하나라도 → check, 모두 충족 → pass */
function mustStatus(results) {
  if (results.some((r) => r.value === false)) return 'fail';
  if (results.some((r) => r.value === null || r.value === undefined)) return 'check';
  return 'pass';
}

const byName = (a, b) => String(a.name).localeCompare(String(b.name), 'ko');
const num = (x, d) => (x === null || x === undefined ? d : x);

/**
 * 종합 추천 정렬. items: [{id,name,distance(m|null), crit:[...]}]
 * 확인 정도 50% 미만은 lack 묶음으로 보내 상위에 올리지 않음. 동점: 확인 정도 높은 순 → 거리 가까운 순 → 이름순
 */
function rankComposite(items) {
  const scored = items.map((it) => ({ ...it, score: composite(it.crit) }));
  const main = scored.filter((x) => x.score.index !== null && x.score.coverage >= MIN_COVERAGE);
  const lack = scored.filter((x) => !(x.score.index !== null && x.score.coverage >= MIN_COVERAGE));
  const cmp = (a, b) => (num(b.score.index, -1) - num(a.score.index, -1)) || (b.score.coverage - a.score.coverage) || (num(a.distance, Infinity) - num(b.distance, Infinity)) || byName(a, b);
  return { main: main.sort(cmp), lack: lack.sort(cmp) };
}

/**
 * 우선순위대로 정렬. order: 기준 키 순서. bins: {키: (값0~1) => 묶음 번호(클수록 좋음)}
 * 1순위 기준의 묶음 → 같은 묶음 안에서 2순위 → … 그 기준이 미확인이면 그 단계에서 순위를 매기지 않고 뒤로(미확인 표시).
 */
function rankPriority(items, order, bins = {}) {
  const val = (it, k) => it.crit.find((c) => c.key === k)?.value ?? null;
  const bin = (k, v) => (v === null ? null : (bins[k] ? bins[k](v) : Math.round(v * 10)));
  return [...items].sort((a, b) => {
    for (const k of order) {
      const x = bin(k, val(a, k)), y = bin(k, val(b, k));
      if (x === null && y === null) continue;
      if (x === null) return 1;
      if (y === null) return -1;
      if (x !== y) return y - x;
    }
    return (num(a.distance, Infinity) - num(b.distance, Infinity)) || byName(a, b);
  });
}

/**
 * 가족 전체 보기: 모든 아이가 필수 조건을 통과해야 pass. 한 아이라도 fail이면 fail, 아니면 하나라도 check면 check.
 * 종합 지표는 아이들 중 가장 낮은 값으로 정렬(한 아이의 약점이 다른 아이의 장점에 가려지지 않도록).
 */
function familyStatus(perKid) {
  if (perKid.some((s) => s === 'fail')) return 'fail';
  if (perKid.some((s) => s === 'check')) return 'check';
  return 'pass';
}

function outdoorLines(text) {
  const t = norm(text).replace(/\n/g, ' ');
  const re = /[^.。▸◦•\-/]{0,30}(?:바깥\s*놀이|숲\s*(?:데이|체험|놀이)|실외\s*놀이)[^.。▸◦•/]{0,30}/g;
  const freq = /(매일|1일\s*\d|하루\s*\d|주\s*\d\s*회|매주|월\s*\d\s*회|매월|\d+\s*분\s*이상|\d\s*시간\s*이상)/;
  const seen = new Set();
  return [...t.matchAll(re)].map((x) => x[0].trim()).filter((s) => freq.test(s) && !seen.has(s) && seen.add(s)).slice(0, 6);
}

/** 운영계획 글 → { scores, tags, outdoor, focusCount } */
function analyzePlan(text) {
  const t = norm(text);
  const focus = focusSections(t).join('\n');
  const scores = {};
  for (const [k, s] of Object.entries(STYLES)) {
    const body = s.words.reduce((a, w) => a + count(t, w), 0);
    const f = s.words.reduce((a, w) => a + count(focus, w), 0);
    scores[k] = Math.round((Math.log1p(body) + 3 * Math.log1p(f)) * 10) / 10;
  }
  const focusCount = focusSections(t).length;
  // 학사일정만 올린 짧은 문서는 분류하지 않음(일정표의 '숲체험' 몇 번으로 방향을 단정하지 않기)
  const enough = t.length >= 8000 && focusCount > 0;
  return { scores, tags: enough ? tagsFromScores(scores) : [], outdoor: outdoorLines(t), focusCount, chars: t.length, note: enough ? null : '교육방침·중점교육이 없는 문서(학사일정 등) — 분류하지 않음' };
}

/** 점수 → 기관 안에서 상대적으로 두드러진 방향(최대 3개)만 '강조' */
function tagsFromScores(scores) {
  const arr = Object.entries(scores).sort((a, b) => b[1] - a[1]);
  const top = arr[0]?.[1] ?? 0;
  if (!top) return [];
  return arr.map(([k, v], i) => ({ key: k, label: STYLES[k].label, level: i < 3 && v >= top * 0.8 ? '강조' : v >= top * 0.5 ? '언급' : '적음', score: v }));
}

  5: ['body', 'nature'], 6: ['body', 'nature'], // 움직임
  7: ['play'], 8: ['play'], 22: ['play'], 24: ['play'], // 몰입·선택·탐색
  23: ['nature', 'play'], // 직접 해보기

function kidStyles(answers) {

  for (const [n, keys] of Object.entries(SURVEY_STYLE)) if (HIGH.has(answers?.[n])) for (const k of keys) (hit[k] ??= []).push(+n);
  return hit; // { play: [7, 22], ... }
}

/** 원하는 방향들과 기관 분류의 맞춤 정도 0~1 (강조 1, 언급 0.5, 적음 0). 분류가 없으면 null */
function styleMatch(tags, wanted) {
  if (!tags?.length || !wanted.length) return null;
  const lv = Object.fromEntries(tags.map((t) => [t.key, t.level]));
  const v = wanted.reduce((a, k) => a + (lv[k] === '강조' ? 1 : lv[k] === '언급' ? 0.5 : 0), 0) / wanted.length;
  return Math.round(v * 100) / 100;
}

function haversine(a, b) {
  const R = 6371000, r = (x) => (x * Math.PI) / 180;
  const dLat = r(b.lat - a.lat), dLng = r(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

function sortList(list) {
  const by = state.sort;
  return list.sort((a, b) => {
    if (by === 'dist' && state.origin) { const da = dist(a), db = dist(b); if (da !== db) return (da ?? Infinity) - (db ?? Infinity); }
    if (by === 'recruit') { const ra = childClass(a).recruit ?? -1, rb = childClass(b).recruit ?? -1; if (ra !== rb) return rb - ra; }
    if (a.kind !== b.kind) { const o = { 유치원: 0, 어린이집: 1 }; return (o[a.kind] ?? 2) - (o[b.kind] ?? 2); }
    return a.name.localeCompare(b.name, 'ko');
  });
}

];
function monthlyCost(it) {
  const off = monthlyCostOfficial(it); const c = consultOf(it);
  if (off) { if (c?.cost && c.cost !== off.won) off.text += ` · 상담 기록 월 ${(+c.cost).toLocaleString('ko-KR')}원(다름)`; return off; }
  if (c?.cost) return { won: +c.cost, text: `월 ${(+c.cost).toLocaleString('ko-KR')}원${cTag(c)}` };
  return null;
}
/** 유치원알리미 비용 공시에서 우리 아이 나이(만3~5세)의 한 달 부담금 */
function pubCostAge(it) {
  const a = manAge(); const pc = it.pubCost;
  if (!pc || a < 3 || a > 5) return null;
  return { age: a, ...pc.byAge[a] };
}
function pubCostParts(pc) {
  const f = (n) => (n === null || n === undefined ? '미확인' : `${n.toLocaleString('ko-KR')}원`);
  return `교육과정 ${f(pc.parts.교육과정)} · 방과후 ${f(pc.parts.방과후)} · 특성화 ${f(pc.parts.특성화)}`;
}
function monthlyCostOfficial(it) {
  if (isDc(it)) return null;

const pad2 = (n) => String(n).padStart(2, '0');

function findDates(text, sy = SY) {
  const out = []; const t = String(text);
  const push = (y, m, d, idx, len) => { if (m < 1 || m > 12 || d < 1 || d > 31) return; const tm = t.slice(idx + len, idx + len + 30).match(/^[^\n\d]{0,12}?(\d{1,2}):(\d{2})/); out.push({ date: `${y}-${pad2(m)}-${pad2(d)}`, time: tm ? `${pad2(tm[1])}:${tm[2]}` : null, idx }); };
  const full = /(20\d{2})\s*[.\-/년]\s*(\d{1,2})\s*[.\-/월]\s*(\d{1,2})\s*일?/g;
  const used = [];
  for (const m of t.matchAll(full)) { push(+m[1], +m[2], +m[3], m.index, m[0].length); used.push([m.index, m.index + m[0].length]); }
  const short = /(?<![\d.])(\d{1,2})\s*(?:월\s*|\.\s*|\/)(\d{1,2})\s*(?:일|\.)?\s*(?=\(|\s|~|$|,)/g;
  for (const m of t.matchAll(short)) {
    if (used.some(([a, b]) => m.index >= a && m.index < b)) continue;
    const mo = +m[1]; push(mo >= 9 ? sy - 1 : sy, mo, +m[2], m.index, m[0].length);
  }
  return out.sort((a, b) => a.idx - b.idx);
}
function eventType(s) {

  if (/공개의 날|참관|둘러보기/.test(s)) return '공개 행사';
  if (/접수|원서/.test(s)) return '접수';
  if (/발표|추첨 결과/.test(s)) return '발표';
  if (/등록/.test(s)) return '등록';
  if (/찜하기|요강 조회/.test(s)) return '요강 공개';
  if (/추가모집|대기/.test(s)) return '추가모집·대기';
  return '기타';
}

    // '2026-11-02(월) 09:00 ~ 11-04(수) 18:00' 의 끝 날짜
    const endM = sch.when.match(/~\s*(\d{2})-(\d{2})/); const end = endM ? `${ds[0].date.slice(0, 4)}-${endM[1]}-${endM[2]}` : (sch.when.match(/~\s*(20\d{2}-\d{2}-\d{2})/)?.[1] ?? null);
    ev.push({ date: ds[0].date, end, time: ds[0].time, type: eventType(sch.step), what: sch.step, who: '충남 공통 (요강을 읽은 유치원 모두 같음)', src: '각 유치원 2027 모집요강', note: sch.note ?? '', kind: 'official' });
  }
  for (const it of DATA.institutions) for (const e of it.admission?.events ?? []) {
    const ds = findDates(e.when);
    ev.push({ date: ds[0]?.date ?? null, time: ds[0]?.time ?? null, type: eventType(e.what), what: e.what, who: it.name, id: it.id, src: e.src ? `${e.src.title}${e.src.posted ? ` (${e.src.posted} 게시)` : ''}` : '기관 홈페이지', note: e.when, kind: 'official' });

}

function analyze(rec) {
  const out = { strength: [], comfort: [], help: [], unseen: [], sup: {} };
  for (const it of ITEMS) {
    const a = rec.answers[it.n];
    if (!a) continue;
    if (a === '관찰 기회 없음') { out.unseen.push(it); continue; }
    const note = rec.notes?.[it.n] ? ` (예: ${rec.notes[it.n]})` : '';
    if (HIGH.has(a)) {
      out[it.type].push(it.hi + note);
      if (it.type !== 'strength' || it.sup === 'quiet_space') (out.sup[it.sup] ??= []).push(it.n);
    } else if (it.lo && LOW.has(a)) {
      out.help.push(it.lo + note); (out.sup[it.sup] ??= []).push(it.n);
    }
  }
  return out;
}

  if (life?.health) q.push(['health', `이런 지원이 가능한가요: ${life.health}`]);

function kidQuestions() {
  const k = curKid(); if (!k) return [];
  const rec = [...k.records].filter((r) => r.by === '부모').sort((a, b) => b.date.localeCompare(a.date))[0] ?? k.records[k.records.length - 1];
  if (!rec) return [];
  const an = analyze(rec);
  const picks = rec.picks ?? [];
  const keys = Object.keys(an.sup).sort((a, b) => (picks.includes(b) ? 1 : 0) - (picks.includes(a) ? 1 : 0));
  const out = keys.map((s) => ({ key: 'kid_' + s, text: SUPPORTS[s].q, why: `${k.nick} 설문 — ${SUPPORTS[s].name}${picks.includes(s) ? ' ★부모가 중요하다고 고름' : ''}` }));

  return out;
}

// ── 4단계: 맞춤 추천 (규칙: docs/07_추천_규칙.md, 계산 함수: src/lib/recommend.js) ──
const LEVELS = ['매우 중요', '중요', '참고'];

function withBirth(b, fn) { const o = state.birth; state.birth = b; try { return fn(); } finally { state.birth = o; } }
const minutesOf = (hhmm) => { const [h, m] = String(hhmm).split(':').map(Number); return h * 60 + m; };

const CRIT = {
  dist: { label: '이동', calc(it) {

    if (R.travel === 'walk' || R.travel === 'car') {
      const r = routeOf(it); const m = r && !r.none ? (R.travel === 'walk' ? r.walkMin : r.carMin) : null;
      if (m === null && R.travel === 'walk' && state.origin?.aptId) {
        // 도보 경로를 계산하지 않은 먼 곳: 걷는 거리는 직선거리보다 짧을 수 없음 → 직선거리 ÷ 도보 속도(분당 약 67m, 카카오 도보 기준)를 최소 시간으로
        const lb = Math.ceil(d / 67);

  care: { label: '돌봄 시간', calc(it) {

  size: { label: '해당 연령 반 규모', calc(it) {
    if (isAca(it)) { const cs0 = consultOf(it); return cs0?.classSize ? { value: linear(+cs0.classSize, state.reco.classStd, state.reco.classStd * 1.5), text: `반 ${cs0.classSize}명${cTag(cs0)}` } : { value: null, text: '반 규모 미확인', q: '우리 아이 반은 몇 명이고 선생님은 몇 분인가요?' }; }
    const a = manAge(); const c = it.classes.find((x) => x.manAge === a && !x.mixed);
    const cs = consultOf(it);
    if (cs?.classSize) return { value: linear(+cs.classSize, state.reco.classStd, state.reco.classStd * 1.5), text: `반 ${cs.classSize}명 예정${cTag(cs)}` };

  } },
  bus: { label: '통학 편의(버스)', calc(it) { const b = busKnown(it); const fromC = busOfficial(it) === null && b !== null; return b === null ? { value: null, text: '버스 미확인', q: '우리 집 근처에 버스가 서나요? 탑승 시간은요?' } : { value: b ? 1 : 0, text: (b ? '버스 운행' : '버스 없음') + (fromC ? cTag(consultOf(it)) : '') }; } },
  nature: { label: '자연·바깥놀이', calc(it) {
    const c = consultOf(it); const v = c?.nature ? NATURE_V[c.nature] : undefined;
    if (v !== undefined) return { value: v, text: `${c.nature}${cTag(c)}` };
    // 상담 기록이 없으면 운영계획의 방향을 약하게 반영 (빈도는 계획서 표기일 뿐이라 최고점은 주지 않음)
    const t = it.profile?.tags?.find((x) => x.key === 'nature');
    if (t && !t.auto) return { value: t.level === '강조' ? 0.8 : t.level === '언급' ? 0.5 : 0.3, text: `운영계획: 자연·생태 ${t.level === '강조' ? '중점' : t.level === '언급' ? '정기 활동' : '중점 아님'} (실제 빈도는 상담 확인)`, q: '바깥놀이·숲 활동은 일주일에 몇 번, 한 번에 얼마나 하나요?' };
    return { value: null, text: '빈도 미확인', q: '바깥놀이·숲 활동은 일주일에 몇 번, 한 번에 얼마나 하나요?' };

    if (v === null) return { value: null, text: `${want.map(styleShort).join('·')} — 운영계획 미확인`, q: '원에서 가장 중점으로 하는 교육은 무엇이고, 하루 중 얼마나 하나요?' };

  } },

    if (!picks.length) return { value: null, text: '설문에서 고른 지원 없음', q: null };

    if (!ans.length) return { value: null, text: `${picks.map((p) => SUPPORTS[p].name).join(', ')} — 기관 확인 전`, q: SUPPORTS[picks[0]].q };
    const v = ans.reduce((a, x) => a + SUPPORT_V[x], 0) / ans.length;

};
const tone = (v) => (v === null ? 'u' : v >= 0.7 ? 'g' : v >= 0.4 ? 'm' : 'b');

function whoList() {
  const ks = state.kids.map((k) => ({ id: k.id, label: `${k.nick} (${k.birth}년생)`, kids: [k] }));
  if (ks.length >= 2) ks.push({ id: 'family', label: '가족 전체', kids: state.kids });
  if (!ks.length) ks.push({ id: 'sample', label: `${state.birth}년생 (헤더의 출생연도)`, kids: [{ id: 'sample', nick: `${state.birth}년생`, birth: state.birth, records: [] }] });
  return ks;
}
function evalFor(it, kid) {
  state.evalKid = kid.records ? kid : null;
  return withBirth(kid.birth, () => {
    const must = state.must.map((k) => ({ k, value: mustVal(it, k) }));
    const crit = state.reco.crit.filter((c) => c.on).map((c) => ({ key: c.key, weight: WEIGHTS[c.w], w: c.w, ...CRIT[c.key].calc(it) })).filter((c) => !c.skip); // skip = 이 아이에게 해당 없는 기준(계산에서 뺌)
    return { kid, cc: childClass(it), must, mustSt: mustStatus(must), crit, score: composite(crit) };
  });
}

function recoCard(row, rank) {
  const it = row.it; const e = row.evals[0];
  const multi = row.evals.length > 1;
  const reasons = e.crit.filter((c) => c.value !== null && c.value >= 0.7 && c.weight >= 2).map((c) => `${CRIT[c.key].label}: ${c.text} (${c.w})`);
  const worries = [];
  for (const ev of row.evals) {
    for (const c of ev.crit) if (c.value !== null && c.value < 0.4) worries.push(`${multi ? ev.kid.nick + ' · ' : ''}${CRIT[c.key].label}: ${c.text}`);
    for (const m of ev.must) if (m.value === null) worries.push(`${multi ? ev.kid.nick + ' · ' : ''}필수 조건 미확인: ${MUSTS.find((x) => x.key === m.k).label.replace(/ \(.*\)$/, '')}`);
  }
  const qs = [...new Set(e.crit.filter((c) => c.value === null && c.q).map((c) => c.q))];
  const sc = row.score;
  return `<div class="rcard">
    <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline"><div>${rank ? `<span class="rk">${rank}</span>` : ''}<strong>${esc(it.name)}</strong></div><div class="tags">${typeTag(it)}<span class="tag">${esc(it.area)}</span></div></div>
    ${consultOf(it)?.status ? `<div class="small"><span class="state warn">내 진행 상태: ${esc(consultOf(it).status)}</span></div>` : ''}
    ${state.reco.mode === 'composite' ? `<div class="score">비교 지표 <b>${sc.index === null ? '–' : Math.round(sc.index)}</b> · 정보 확인 정도 <b>${Math.round(sc.coverage * 100)}%</b>${multi ? ' <span class="small muted">(아이들 중 낮은 값)</span>' : ''}</div>` : ''}
    ${row.evals.map((ev) => `<div class="small">${multi ? `<b>${esc(ev.kid.nick)}</b> · ` : ''}${esc(ev.cc.text)}${multi && state.reco.mode === 'composite' ? ` · 지표 ${ev.score.index === null ? '–' : Math.round(ev.score.index)}` : ''}</div>`).join('')}
    <div class="reasons">${e.crit.filter((c) => !(multi && c.key === 'size')).map((c) => `<span class="cv ${tone(c.value)}">${esc(CRIT[c.key].label)}: ${esc(c.text)}</span>`).join('')}${multi ? row.evals.map((ev) => ev.crit.filter((c) => c.key === 'size').map((c) => `<span class="cv ${tone(c.value)}">${esc(ev.kid.nick)} 반 규모: ${esc(c.text)}</span>`).join('')).join('') : ''}</div>
    ${reasons.length ? `<div><span class="small muted">추천 이유</span><ul class="rlist">${reasons.map((r) => `<li>${esc(r)}</li>`).join('')}</ul></div>` : ''}
    ${worries.length ? `<div><span class="small muted">우려·확인할 점</span><ul class="rlist">${worries.map((r) => `<li>${esc(r)}</li>`).join('')}</ul></div>` : ''}
    ${qs.length ? `<div><span class="small muted">상담 질문</span><ul class="rlist">${qs.slice(0, 3).map((r) => `<li>${esc(r)}</li>`).join('')}</ul></div>` : ''}
    <div class="src">출처: ${isDc(it) ? `${esc(it.source)} · ` : ''}${it.kind === '유치원' ? `유치원알리미 공시(${esc(it.pubAsOf ?? '')})${it.admission?.read ? ` · 2027 요강(${it.admission.sources?.[0]?.posted ? esc(it.admission.sources[0].posted) + ' 게시' : '홈페이지 화면'})` : ''}` : isDc(it) ? '' : `${esc(DATA.academySource?.name)} (${esc(DATA.academySource?.asOf)})`} · 확인일 ${esc(DATA.roster.checkedAt)}</div>
    <div class="acts" style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn" type="button" data-open="${esc(it.id)}">상세</button><button class="btn" type="button" data-ask="${esc(it.id)}">질문지</button></div>
  </div>`;
}

function drawReco() {
  const R = state.reco;
  const whos = whoList();
  if (!whos.some((w) => w.id === R.who)) R.who = whos[0].id;
  const who = whos.find((w) => w.id === R.who);
  const pool = DATA.institutions.filter((it) => it.kind === '유치원' || (isDc(it) && R.withDaycare !== false) || (isAca(it) && R.withAcademy));
  const rows = pool.map((it) => {
    const evals = who.kids.map((k) => evalFor(it, k));
    const st = familyStatus(evals.map((e) => e.mustSt));
    const idx = evals.map((e) => e.score.index);
    const score = { index: idx.some((x) => x === null) ? null : Math.min(...idx), coverage: Math.min(...evals.map((e) => e.score.coverage)) };
    return { it, evals, st, score, id: it.id, name: it.name, distance: dist(it), crit: evals[0].crit };
  });

// ── 6단계: 계정별 저장 (claude.ai 계정의 비공개 공간 data/users/<본인>/state) ──
// 다른 사람(페이지 주인 포함)은 읽을 수 없음 — 플랫폼 규칙. 쓰기는 사용 중인 기기의 화면에서만, 바뀐 뒤 잠시 멈췄을 때 한 번.
const PERSIST = { birth: 'birth', origin: 'origin', compare: 'compare', sort: 'sort', filters: 'f', tab: 'tab', must: 'must', fam: 'fam', plan: 'plan', askId: 'askId', qdone: 'qdone', memo: 'memo', kids: 'kids', kidSel: 'kidSel', recSel: 'recSel', kidMode: 'kidMode', reco: 'reco', consult: 'consult', myEvents: 'myEvents', archive: 'archive', calMine: 'calMine' };
const cloud = { mode: 'local', ref: null, timer: null, saving: false, again: false, lastAt: null, err: null, lastBody: null, applying: false };
function snapshotData() { const d = {}; for (const [k, f] of Object.entries(PERSIST)) if (state[f] !== undefined) d[k] = state[f]; return d; }
function hasPersonal(d) { return !!(d.kids?.length || Object.keys(d.consult ?? {}).length || d.plan?.length || d.myEvents?.length || Object.keys(d.memo ?? {}).length || d.archive?.length); }
function applyData(d) {
  cloud.applying = true;
  for (const [k, f] of Object.entries(PERSIST)) if (d[k] !== undefined) { state[f] = d[k]; try { localStorage.setItem('bt-' + k, JSON.stringify(d[k])); } catch {} }
  state.f = normFilters(state.f);
  $('#birth').value = state.birth; $('#sort').value = state.sort;
  render(); showTab(state.tab);
  cloud.applying = false;
}
function drawSaveState() {
  const el = $('#saveState'); if (!el) return;
  el.textContent = cloud.mode === 'cloud' ? `저장: 내 claude.ai 계정(본인만 보기)${cloud.saving ? ' · 저장 중…' : cloud.lastAt ? ' · 저장됨 ' + cloud.lastAt : ''}` : cloud.mode === 'readonly' ? '저장: 이 기기만 (이 페이지에서 계정 저장 권한이 없음)' : '저장: 이 기기 브라우저만';
}
async function cloudSave() {
  if (!cloud.ref) return;
  if (cloud.saving) { cloud.again = true; return; }
  cloud.saving = true; drawSaveState();
  try {
    const data = snapshotData();
    const body = JSON.stringify(data);
    if (body === cloud.lastBody) return; // 바뀐 것이 없으면 쓰지 않음
    if (body.length > 240000) { data.archive = (data.archive ?? []).map((a) => ({ ...a, text: a.text.slice(0, 800) })); }
    await cloud.ref.set({ v: 1, savedAt: new Date().toISOString(), data });
    cloud.lastBody = body;
    cloud.lastAt = new Intl.DateTimeFormat('ko-KR', { timeZone: 'Asia/Seoul', hour: '2-digit', minute: '2-digit' }).format(new Date());
  } catch (e) {
    if (e?.code === 'invalid_argument' || e?.code === 'not_granted') { cloud.mode = 'readonly'; cloud.ref = null; }
    cloud.err = e?.code ?? 'error';
  } finally { cloud.saving = false; drawSaveState(); if (cloud.again) { cloud.again = false; cloudSave(); } }
}
const UI_KEYS = new Set(['filters', 'tab', 'sort', 'calMine']); // 화면 설정만 — 개인 기록은 항상 계정 값을 따름
document.addEventListener('pointerdown', () => { cloud.userActed = true; }, { capture: true, once: true });
document.addEventListener('keydown', () => { cloud.userActed = true; }, { capture: true, once: true });
window.__cloudMark = (k) => { if (!cloud.ref && !cloud.applying && cloud.userActed && UI_KEYS.has(k)) (cloud.touched ??= new Set()).add(k); if (!cloud.ref || cloud.applying) return; clearTimeout(cloud.timer); cloud.timer = setTimeout(cloudSave, 1500); };
async function cloudInit() {
  try {
    const [user, db] = await Promise.all([window.claude?.use?.('user'), window.claude?.use?.('db')]);
    if (!user || !db) { drawSaveState(); return; }
    const id = await user.id();
    if (!id) { drawSaveState(); return; }
    const ref = db.doc('data/users/' + id + '/state');
    const snap = await ref.get();
    cloud.ref = ref; cloud.mode = 'cloud';
    if (snap.exists && snap.data()?.data) {
      // 불러오는 동안 사용자가 바꾼 항목(필터·탭 등)은 덮어쓰지 않음
      const d = { ...snap.data().data };
      for (const k of cloud.touched ?? []) delete d[k];
      applyData(d);
      if (cloud.touched?.size) setTimeout(cloudSave, 300);
      cloud.lastBody = cloud.touched?.size ? null : JSON.stringify(snapshotData()); // 바꾼 화면 설정이 있으면 계정에도 저장
      cloud.lastAt = snap.data().savedAt ? new Intl.DateTimeFormat('ko-KR', { timeZone: 'Asia/Seoul', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }).format(new Date(snap.data().savedAt)) : null;
    } else if (hasPersonal(snapshotData())) {
      await cloudSave(); // 처음 한 번: 이 기기 기록을 내 계정 비공개 공간으로 옮김
    }
  } catch (e) { cloud.mode = cloud.ref ? cloud.mode : 'local'; }
  drawSaveState();
}

  state.tab = t; store.set('tab', t);

  if (t === 'pick') drawPick(); if (t === 'ask') drawAsk(); if (t === 'kid') drawKid(); if (t === 'reco') drawReco(); if (t === 'cal') drawCal(); if (t === 'me') drawMe();
}

function render() {
  const list = sortList(DATA.institutions.filter((it) => passes(it)));
  drawMap(list);
  drawFilters();
  $('#count').textContent = `${list.length}곳`;
  $('#activeRule').textContent = activeRule();
  $('#cards').innerHTML = list.length ? list.map(card).join('') : emptyHelp();
  $('#clearOrigin').hidden = !state.origin;
  const items = state.compare.map((id) => DATA.institutions.find((x) => x.id === id)).filter(Boolean);
  $('#cmpbar').hidden = items.length === 0;
  $('#cmpItems').innerHTML = items.map((it) => `<button class="chip" type="button" data-cmp="${esc(it.id)}" aria-pressed="true">${esc(it.name.replace('초등학교병설유치원', '초 병설'))} ✕</button>`).join('');
  $('#cmpOpen').disabled = items.length < 2;
  const a = manAge();
  if (state.tab === 'pick') drawPick(); if (state.tab === 'ask') drawAsk(); if (state.tab === 'reco') drawReco();
  $('#childLabel').textContent = `→ ${SY}학년도 만${a}세 · 요강 표기 "${a}세반" · 옛 표기 "${a + 2}세반"`;
}

function select(id, scroll) {
  state.sel = id; render();
  const it = DATA.institutions.find((x) => x.id === id);
  if (it?.lat && typeof zoomLevel === 'function' && zoomLevel() > 1.2) { const x = MAP.px(it.lng), y = MAP.py(it.lat); if (x < VIEW.x || x > VIEW.x + VIEW.w || y < VIEW.y || y > VIEW.y + VIEW.h) { VIEW.x = x - VIEW.w / 2; VIEW.y = y - VIEW.h / 2; clampView(); applyView(true); } }
  if (scroll) document.getElementById('c-' + id)?.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

// ── 이벤트 ────────────────────────────────────────────
document.addEventListener('click', (e) => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.tab) { showTab(t.dataset.tab); return; }
  if (t.id === 'exportBtn') { doExport(); return; }
  if (t.id === 'exportShow') { const ta = $('#exportText'); ta.hidden = false; ta.value = JSON.stringify({ app: '배방·탕정 유치원 지도', exportedAt: new Date().toISOString(), data: snapshotData() }, null, 2); ta.select(); return; }
  if (t.id === 'importBtn') { const f = $('#importFile').files?.[0]; if (f) { const r = new FileReader(); r.onload = () => doImport(String(r.result)); r.readAsText(f); } else doImport($('#importText').value); return; }
  if (t.id === 'wipeBtn') { const b = $('#wipeAsk'); b.hidden = false; b.innerHTML = '정말 모두 지울까요? <button class="btn" type="button" id="wipeYes">지우기</button> <button class="btn" type="button" id="wipeNo">취소</button>'; return; }
  if (t.id === 'wipeNo') { $('#wipeAsk').hidden = true; return; }
  if (t.id === 'wipeYes') { doWipe(); return; }
  if (t.id === 'calMine') { state.calMine = !state.calMine; store.set('calMine', state.calMine); drawCal(); return; }
  if (t.id === 'ne-add') { const date = $('#ne-date').value; const what = $('#ne-what').value.trim(); if (!date || !what) { $('#ne-what').placeholder = '날짜와 내용을 넣어 주세요'; return; } const id = $('#ne-inst').value; const it = DATA.institutions.find((x) => x.id === id); state.myEvents.push({ uid: uid(), date, time: $('#ne-time').value || null, type: $('#ne-type').value, what, who: it?.name ?? '기타·공통', id: id || null, src: '', note: '' }); store.set('myEvents', state.myEvents); drawCal(); return; }
  if (t.dataset.delev) { state.myEvents = state.myEvents.filter((e) => e.uid !== t.dataset.delev); store.set('myEvents', state.myEvents); drawCal(); return; }
  if (t.id === 'ar-find') { findInArchive(); return; }
  if (t.id === 'ar-save') { const d = state.arDraft; if (!d) return; const id = $('#ar-inst').value; const it = DATA.institutions.find((x) => x.id === id); const who = it?.name ?? '기타·공통'; const src = $('#ar-src').value.trim();
    document.querySelectorAll('[data-ard]').forEach((cb) => { if (!cb.checked) return; const x = d.ds[+cb.dataset.ard]; state.myEvents.push({ uid: uid(), date: x.date, time: x.time, type: x.type, what: x.line.slice(0, 60), who, id: id || null, src: `붙여 넣은 공지${src ? ' · ' + src : ''}`, note: '' }); });
    state.archive.push({ uid: uid(), who, src, text: d.text.slice(0, 5000), saved: today(), yearWarn: d.warn }); state.arDraft = null;
    store.set('myEvents', state.myEvents); store.set('archive', state.archive); drawCal(); return; }
  if (t.dataset.delar) { state.archive = state.archive.filter((a) => a.uid !== t.dataset.delar); store.set('archive', state.archive); drawCal(); return; }
  if (t.dataset.who) { state.reco.who = t.dataset.who; saveReco(); drawReco(); return; }
  if (t.dataset.rmode) { state.reco.mode = t.dataset.rmode; saveReco(); drawReco(); return; }
  if (t.dataset.cup || t.dataset.cdown) { const c = state.reco.crit; const i = +(t.dataset.cup ?? t.dataset.cdown); const j = t.dataset.cup ? i - 1 : i + 1; if (j >= 0 && j < c.length) [c[i], c[j]] = [c[j], c[i]]; saveReco(); drawReco(); return; }
  if (t.dataset.kid) { state.kidSel = t.dataset.kid; state.recSel = curKid()?.records.at(-1)?.id ?? null; store.set('kidSel', state.kidSel); store.set('recSel', state.recSel); drawKid(); return; }
  if (t.dataset.rec) { state.recSel = t.dataset.rec; store.set('recSel', state.recSel); drawKid(); return; }
  if (t.dataset.kmode) { state.kidMode = t.dataset.kmode; store.set('kidMode', state.kidMode); drawKid(); window.scrollTo({ top: 0 }); return; }
  if (t.id === 'recNew' || t.id === 'recNewT') { const k = curKid(); const prev = [...k.records].filter((r) => r.by === t.dataset.by).at(-1); const r = { id: uid(), date: today(), by: t.dataset.by, answers: {}, notes: {}, life: prev ? { ...prev.life } : {}, picks: prev ? [...(prev.picks ?? [])] : [] }; k.records.push(r); state.recSel = r.id; state.kidMode = 'form'; saveKids(); store.set('recSel', r.id); drawKid(); return; }
  if (t.id === 'kidUse') { state.birth = curKid().birth; store.set('birth', state.birth); $('#birth').value = state.birth; render(); return; }
  if (t.id === 'recDel' || t.id === 'kidDel') { const box = $('#delAsk'); box.hidden = false; box.innerHTML = `${t.id === 'kidDel' ? '아이와 모든 기록을' : '이 기록을'} 지울까요? 되돌릴 수 없습니다. <button class="btn" type="button" id="${t.id}Yes">지우기</button> <button class="btn" type="button" id="delNo">취소</button>`; return; }
  if (t.id === 'delNo') { $('#delAsk').hidden = true; return; }
  if (t.id === 'recDelYes') { const k = curKid(); k.records = k.records.filter((r) => r.id !== state.recSel); state.recSel = k.records.at(-1)?.id ?? null; saveKids(); store.set('recSel', state.recSel); drawKid(); return; }
  if (t.id === 'kidDelYes') { state.kids = state.kids.filter((x) => x.id !== state.kidSel); state.kidSel = state.kids[0]?.id ?? null; state.recSel = null; saveKids(); store.set('kidSel', state.kidSel); drawKid(); return; }
  if (t.dataset.plan) { const id = t.dataset.plan; const i = state.plan.indexOf(id); if (i >= 0) state.plan.splice(i, 1); else if (state.plan.length < 3) state.plan.push(id); store.set('plan', state.plan); drawPick(); return; }
  if (t.id === 'planUp') { const p = state.plan; if (p.length > 1) [p[0], p[1]] = [p[1], p[0]]; store.set('plan', p); drawPick(); return; }
  if (t.id === 'planClear') { state.plan = []; store.set('plan', []); drawPick(); return; }
  if (t.dataset.ask) { state.askId = t.dataset.ask; store.set('askId', state.askId); showTab('ask'); window.scrollTo({ top: 0 }); return; }
  if (t.dataset.g) { const arr = state.f[t.dataset.g]; const i = arr.indexOf(t.dataset.v); i >= 0 ? arr.splice(i, 1) : arr.push(t.dataset.v); store.set('filters', state.f); render(); }
  else if (t.dataset.c) { const arr = state.f.cond; const i = arr.indexOf(t.dataset.c); i >= 0 ? arr.splice(i, 1) : arr.push(t.dataset.c); store.set('filters', state.f); render(); }
  else if (t.id === 'unk') { state.f.unknown = !state.f.unknown; store.set('filters', state.f); render(); }
  else if (t.id === 'reset') { state.f = { kind: [], est: [], area: [], style: [], cond: [], radius: state.f.radius, unknown: true }; store.set('filters', state.f); render(); }
  else if (t.dataset.relax) { const k = t.dataset.relax; if (state.f[k] && Array.isArray(state.f[k])) state.f[k] = []; else state.f.cond = state.f.cond.filter((x) => x !== k); store.set('filters', state.f); render(); }
  else if (t.dataset.open) { const it = DATA.institutions.find((x) => x.id === t.dataset.open); state.sel = it.id; render(); openSheet(it.name, detail(it)); }
  else if (t.dataset.cmp) { const id = t.dataset.cmp; const i = state.compare.indexOf(id); if (i >= 0) state.compare.splice(i, 1); else if (state.compare.length < 4) state.compare.push(id); store.set('compare', state.compare); render(); if (t.dataset.insheet) { const it = DATA.institutions.find((x) => x.id === id); $('#sheetBody').innerHTML = detail(it); } }
  else if (t.dataset.rstyle) { const k = t.dataset.rstyle; const a = state.reco.styles; const i = a.indexOf(k); if (i >= 0) a.splice(i, 1); else a.push(k); saveReco(); render(); }
  else if (t.id === 'cmpOpen') openSheet(`나란히 비교 (${state.compare.length}곳)`, compareTable());
  else if (t.id === 'sheetClose') closeSheet();
  else if (t.id === 'clearOrigin') { $('#aptInput').value = ''; setOrigin(null); }
  else if (t.dataset.copy) { const v = t.dataset.copy; const done = () => { t.textContent = '복사됨'; setTimeout(() => (t.textContent = '복사'), 1500); }; try { navigator.clipboard.writeText(v).then(done, () => selectText(t)); } catch { selectText(t); } }
  else if (t.id === 'geoBtn') {
    const fail = () => { $('#mapNote').textContent = '이 화면에서는 현재 위치를 쓸 수 없습니다. 지도에서 집 근처를 눌러 출발지를 정해 주세요.'; };
    try { navigator.geolocation.getCurrentPosition((p) => setOrigin({ lat: p.coords.latitude, lng: p.coords.longitude, how: '현재 위치' }), fail, { timeout: 8000 }); } catch { fail(); }
  }
});
function selectText(btn) { const code = btn.parentElement.querySelector('code, a'); if (!code) return; const r = document.createRange(); r.selectNodeContents(code); const s = getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = '선택됨 — 복사하세요'; }
document.addEventListener('input', (e) => { if (e.target.id === 'radius') { state.f.radius = +e.target.value; store.set('filters', state.f); $('#radiusVal').textContent = `${state.f.radius}km`; } });
document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.id === 'radius') render();
  else if (el.dataset.must) { const k = el.dataset.must; state.must = el.checked ? [...state.must, k] : state.must.filter((x) => x !== k); store.set('must', state.must); if (state.tab === 'reco') drawReco(); else drawPick(); }
  else if (el.dataset.con) { state.reco.crit.find((c) => c.key === el.dataset.con).on = el.checked; saveReco(); drawReco(); }
  else if (el.dataset.cw) { state.reco.crit.find((c) => c.key === el.dataset.cw).w = el.value; saveReco(); drawReco(); }
  else if (el.id && el.id.startsWith('rp-')) {
    const R = state.reco, v = el.value;
    if (el.id === 'rp-ok') R.okKm = Math.max(0, +v || 0); if (el.id === 'rp-max') R.maxKm = Math.max(0.5, +v || 4);
    if (el.id === 'rp-pick') R.pickup = v; if (el.id === 'rp-budget') R.budget = v ? Math.max(0, +v) : null;
    if (el.id === 'rp-travel') R.travel = v; if (el.id === 'rp-okw') R.okWalk = Math.max(0, +v || 0); if (el.id === 'rp-maxw') R.maxWalk = Math.max(1, +v || 30); if (el.id === 'rp-okc') R.okCar = Math.max(0, +v || 0); if (el.id === 'rp-maxc') R.maxCar = Math.max(1, +v || 20);
    if (R.maxWalk <= R.okWalk) R.maxWalk = R.okWalk + 5; if (R.maxCar <= R.okCar) R.maxCar = R.okCar + 5;
    if (el.id === 'rp-std') R.classStd = Math.max(5, +v || 16); if (el.id === 'rp-aca') R.withAcademy = el.checked; if (el.id === 'rp-dc') R.withDaycare = el.checked;
    if (R.maxKm <= R.okKm) R.maxKm = R.okKm + 0.5;
    saveReco(); drawReco();
  }
  else if (el.dataset.fam) { const k = el.dataset.fam; state.fam = el.checked ? [...state.fam, k] : state.fam.filter((x) => x !== k); store.set('fam', state.fam); drawPick(); }
  else if (el.dataset.cs) { const id = state.askId; const c = (state.consult[id] ??= {}); const v = el.value; if (v === '') delete c[el.dataset.cs]; else c[el.dataset.cs] = v; if (!c.date && v) c.date = today(); store.set('consult', state.consult); if (el.dataset.cs !== 'date') { const dEl = document.querySelector('[data-cs="date"]'); if (dEl && !dEl.value) dEl.value = c.date; } }
  else if (el.dataset.cssup) { const id = state.askId; const c = (state.consult[id] ??= {}); (c.supports ??= {}); if (el.value) c.supports[el.dataset.cssup] = el.value; else delete c.supports[el.dataset.cssup]; if (!c.date) c.date = today(); store.set('consult', state.consult); }
  else if (el.dataset.kq) { const r = curRec(); r.answers[el.dataset.kq] = el.value; saveKids(); const p = document.getElementById('kprog'); if (p) p.textContent = `${Object.keys(r.answers).length}/24문항 답함 · 바로 저장됩니다`; }
  else if (el.dataset.pick) { const r = curRec(); const k = el.dataset.pick; r.picks = el.checked ? [...(r.picks ?? []), k] : (r.picks ?? []).filter((x) => x !== k); saveKids(); }
  else if (el.id === 'askSel') { state.askId = el.value; store.set('askId', state.askId); drawAsk(); }
  else if (el.dataset.q) { const id = state.askId; const arr = state.qdone[id] ?? []; state.qdone[id] = el.checked ? [...arr, el.dataset.q] : arr.filter((x) => x !== el.dataset.q); store.set('qdone', state.qdone); }
});
document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.dataset.kn) { const r = curRec(); (r.notes ??= {})[el.dataset.kn] = el.value; saveKids(); }
  if (el.dataset.life) { const r = curRec(); (r.life ??= {})[el.dataset.life] = el.value; saveKids(); }
});
document.addEventListener('submit', (e) => {
  if (e.target.id !== 'kidAdd') return;
  e.preventDefault();
  const nick = $('#kidNick').value.trim(); const birth = +$('#kidBirth').value;
  if (!nick || !birth) return;
  const k = { id: uid(), nick, birth, records: [] }; state.kids.push(k); state.kidSel = k.id; state.recSel = null; saveKids(); store.set('kidSel', k.id); drawKid();
});
document.addEventListener('input', (e) => { if (e.target.id === 'memo') { state.memo[state.askId] = e.target.value; store.set('memo', state.memo); } });
$('#overlay').addEventListener('click', (e) => { if (e.target.id === 'overlay') closeSheet(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#overlay').hidden) closeSheet(); });
$('#sort').value = state.sort;
$('#sort').addEventListener('change', (e) => { state.sort = e.target.value; store.set('sort', state.sort); render(); });
$('#aptList').innerHTML = (DATA.apartments ?? []).map((a) => `<option value="${esc(a.name)}${a.planned ? ' (입주 예정)' : ''} · ${esc(a.area)}"></option>`).join('');
if (state.origin?.aptId) $('#aptInput').value = state.origin.name;
$('#aptInput').addEventListener('change', (e) => {
  const v = e.target.value.replace(/ · (배방읍|탕정면)$/, '').replace(/ \(입주 예정\)$/, '');
  const a = (DATA.apartments ?? []).find((x) => x.name === v);
  if (a) setOrigin({ lat: a.lat, lng: a.lng, how: '아파트', aptId: a.id, name: a.name });
});
$('#birth').innerHTML = [SY - 6, SY - 5, SY - 4, SY - 3, SY - 2].map((y) => `<option value="${y}">${y}년생</option>`).join('');
$('#birth').value = state.birth;
$('#birth').addEventListener('change', (e) => { state.birth = +e.target.value; store.set('birth', state.birth); render(); });

// 안내·출처
const nK = DATA.institutions.filter((x) => x.kind === '유치원').length;
const nD = DATA.institutions.filter(isDc).length;
const nA = DATA.institutions.filter(isAca).length;
const nRead = DATA.institutions.filter((x) => x.admission?.read).length;
$('#notice').innerHTML = `<span><b>${SY}학년도</b> 기준</span><span>유치원 <b>${nK}곳</b>(공식 명부) · 2027 요강 확인 <b>${nRead}곳</b></span><span>영어유치원·유아 영어학원 <b>${nA}곳</b>(교육청 등록 자료)</span>${nD ? `<span>어린이집 <b>${nD}곳</b>(어린이집정보공개포털, 가정어린이집 제외)</span>` : '<span><b>어린이집은 아직 없음</b> — 인증키 승인 대기</span>'}<span>우선모집 접수 <b>11월 2일(월) 9시 ~ 4일(수) 18시</b></span>`;
$('#foot').innerHTML = `<div>유치원: 유치원알리미 공시 (확인일 ${esc(DATA.roster.checkedAt)}) · 모집요강: 각 유치원 홈페이지 원문 (확인일 ${esc(DATA.admissionCheckedAt)})</div>
  <div>영어유치원: ${esc(DATA.academySource?.name ?? U)} (${esc(DATA.academySource?.asOf ?? U)} 기준)</div>
  <div>${esc(DATA.map.source)} · 아파트 단지: ${esc(DATA.routeInfo?.aptSource ?? U)} (${esc(DATA.routeInfo?.aptCheckedAt ?? '')}) · 도보: ${esc(DATA.routeInfo?.walk ?? U)} · 자동차: ${esc(DATA.routeInfo?.car ?? U)}. 도보는 직선 ${(DATA.routeInfo?.rules?.walkMaxStraightM ?? 2500) / 1000}km, 자동차는 ${(DATA.routeInfo?.rules?.carMaxStraightM ?? 7000) / 1000}km 안쪽만 계산. 지도를 눌러 정한 출발지는 직선거리만.</div>
  <div>${esc(DATA.roster.note)} · 화면 자료 생성 ${esc(DATA.builtAt)}</div>`;
render();
showTab(state.tab);
drawSaveState();
cloudInit();
const ask = document.getElementById('askSel'); if (ask) ask.value = state.askId;
</script>
