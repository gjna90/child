const SY = DATA.schoolYear;

// ── 계산 ──────────────────────────────────────────────
function haversine(a, b) {
  const R = 6371000, r = (x) => (x * Math.PI) / 180;
  const dLat = r(b.lat - a.lat), dLng = r(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function dist(it) { return state.origin && it.lat ? haversine(state.origin, it) : null; }
const km = (m) => (m === null ? null : m < 1000 ? `${Math.round(m / 10) * 10}m` : `${(m / 1000).toFixed(1)}km`);

/** 우리 아이 반: {status:'ok'|'warn'|'unk'|'no', text, known} */
function childClass(it) {
  const a = manAge();

  const rec = it.admission?.recruit;
  if (rec) {
    const row = rec.find((x) => {
      const ys = [...String(x.birth).matchAll(/20\d\d/g)].map((m) => +m[0]);
      return ys.length === 1 ? ys[0] === state.birth : ys.length === 2 && state.birth >= ys[0] && state.birth <= ys[1];
    });
    if (row) return { status: 'ok', text: `2027 모집 ${String(row.recruit).replace(/^(\d+)(.*)$/, '$1명$2')} · 요강 표기 ${row.age}`, known: true, recruit: parseInt(row.recruit, 10) };
    return { status: 'no', text: '2027 요강에 해당 출생연도 반 없음', known: false };
  }
  const c = it.classes.find((x) => x.manAge === a && !x.mixed);
  if (c && c.count > 0) return { status: 'warn', text: `올해 만${a}세반 ${c.count}반 운영(공시) · 2027 모집은 요강 확인`, known: true };
  if (it.classes.some((x) => x.mixed && x.count > 0)) return { status: 'warn', text: '혼합연령반만 있음 · 포함 연령 확인 필요', known: null };
  if (c && c.count === 0) return { status: 'no', text: `올해 만${a}세반 없음(공시)`, known: false };

function busKnown(it) {

function lateEnd(it) {

  if (care) ends.push(...[...care.matchAll(/(\d{2}):(\d{2})/g)].map((m) => m[0]));

const GROUPS = [

function passes(it, skip) {
  for (const g of GROUPS) {
    if (skip === g.key) continue;
    const sel = state.f[g.key];
    if (sel.length && !sel.some((v) => g.test(it, v))) return false; // 같은 범주: OR
  }
  for (const c of CONDS) {
    if (skip === c.key || !state.f.cond.includes(c.key)) continue; // 다른 범주: AND
    const v = c.val(it);
    if (v === false) return false;
    if (v === null && !state.f.unknown) return false;

  return true;

// ── 지도 ──────────────────────────────────────────────
const MAP = (() => {
  const focus = DATA.map.areas.filter((a) => a.focus);
  let minX = 180, maxX = -180, minY = 90, maxY = -90;
  for (const a of focus) for (const ring of a.rings) for (const [x, y] of ring) { minX = Math.min(minX, x); maxX = Math.max(maxX, x); minY = Math.min(minY, y); maxY = Math.max(maxY, y); }
  const padX = (maxX - minX) * 0.06, padY = (maxY - minY) * 0.06;
  minX -= padX; maxX += padX; minY -= padY; maxY += padY;
  const kx = Math.cos(((minY + maxY) / 2) * Math.PI / 180);
  const W = 1000, H = Math.round((W * (maxY - minY)) / ((maxX - minX) * kx));
  const px = (lng) => ((lng - minX) / (maxX - minX)) * W;
  const py = (lat) => ((maxY - lat) / (maxY - minY)) * H;
  const inv = (x, y) => ({ lng: minX + (x / W) * (maxX - minX), lat: maxY - (y / H) * (maxY - minY) });
  return { W, H, px, py, inv };
})();

function centroid(ring) { let x = 0, y = 0; for (const p of ring) { x += p[0]; y += p[1]; } return [x / ring.length, y / ring.length]; }

function drawMap(list) {
  const { W, H, px, py } = MAP;
  const path = (ring) => 'M' + ring.map(([x, y]) => `${px(x).toFixed(1)},${py(y).toFixed(1)}`).join('L') + 'Z';
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="배방읍·탕정면 지도. 지도를 누르면 출발지가 정해집니다" id="svgmap">`;
  s += `<rect x="0" y="0" width="${W}" height="${H}" fill="var(--bg)"/>`;
  for (const a of DATA.map.areas) {
    for (const r of a.rings) s += `<path d="${path(r)}" fill="${a.focus ? 'var(--land-focus)' : 'var(--land)'}" stroke="var(--line)" stroke-width="${a.focus ? 2 : 1}"/>`;
  }
  for (const a of DATA.map.areas) {
    const big = a.rings.reduce((m, r) => (r.length > m.length ? r : m), a.rings[0]);
    const [cx, cy] = centroid(big);
    const x = px(cx), y = py(cy);
    if (x < 20 || x > W - 20 || y < 20 || y > H - 20) continue;
    s += `<text x="${x.toFixed(0)}" y="${y.toFixed(0)}" text-anchor="middle" font-size="${a.focus ? 30 : 20}" fill="var(--muted)" opacity="${a.focus ? .75 : .5}" pointer-events="none">${esc(a.name)}</text>`;
  }
  const shown = new Set(list.map((x) => x.id));
  const pts = DATA.institutions.filter((it) => it.lat);
  for (const it of pts) {
    const x = px(it.lng), y = py(it.lat);
    if (x < 0 || x > W || y < 0 || y > H) continue;
    const col = it.kind !== '유치원' ? 'var(--academy)' : it.isPublic ? 'var(--public)' : 'var(--private)';
    const on = shown.has(it.id), sel = state.sel === it.id;
    s += `<g class="pin" data-id="${esc(it.id)}" tabindex="0" role="button" aria-label="${esc(it.name)}" style="cursor:pointer" opacity="${on ? 1 : .25}">`
      + `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${sel ? 15 : 10}" fill="${col}" stroke="var(--surface)" stroke-width="3"/>`
      + (sel ? `<text x="${x.toFixed(1)}" y="${(y - 22).toFixed(1)}" text-anchor="middle" font-size="24" font-weight="600" fill="var(--ink)" stroke="var(--surface)" stroke-width="6" paint-order="stroke">${esc(it.name.replace('초등학교병설유치원', '초 병설'))}</text>` : '')
      + `<title>${esc(it.name)}</title></g>`;
  }
  if (state.origin) {
    const x = px(state.origin.lng), y = py(state.origin.lat);
    s += `<g pointer-events="none"><circle cx="${x}" cy="${y}" r="13" fill="none" stroke="var(--ink)" stroke-width="4"/><circle cx="${x}" cy="${y}" r="4" fill="var(--ink)"/></g>`;
  }
  s += '</svg>';
  $('#map').innerHTML = s;
  const svg = $('#svgmap');
  svg.addEventListener('click', (e) => {
    const pin = e.target.closest('.pin');
    if (pin) { select(pin.dataset.id, true); return; }
    const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    const p = pt.matrixTransform(svg.getScreenCTM().inverse());
    setOrigin({ ...MAP.inv(p.x, p.y), how: '지도에서 지정' });
  });
  svg.addEventListener('keydown', (e) => { const pin = e.target.closest('.pin'); if (pin && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); select(pin.dataset.id, true); } });
  const noLoc = DATA.institutions.filter((it) => !it.lat);
  $('#mapNote').textContent = `점은 유치원알리미 공시 좌표입니다. 지도를 누르면 그곳이 출발지가 되고 직선거리를 계산합니다(정확한 집 주소는 필요 없습니다). 위치 정보가 없어 지도에 없는 곳 ${noLoc.length}곳: 영어유치원·학원(주소만 있음)과 ${noLoc.filter((x) => x.kind === '유치원').map((x) => x.name).join(', ') || '없음'}.`;
}

function setOrigin(o) { state.origin = o; store.set('origin', o); if (state.sort !== 'dist') {} render(); }

const typeTag = (it) => (it.kind !== '유치원' ? '<span class="tag aca">영어유치원·학원</span>' : it.isPublic ? `<span class="tag pub">${esc(it.type)}</span>` : `<span class="tag pri">${esc(it.type)}</span>`);

function hoursText(it) {

function emptyHelp() {
  const active = [...GROUPS.filter((g) => state.f[g.key].length).map((g) => ({ key: g.key, label: g.label })), ...CONDS.filter((c) => state.f.cond.includes(c.key)).map((c) => ({ key: c.key, label: c.label }))];
  const tips = active.map((a) => ({ ...a, n: DATA.institutions.filter((it) => passes(it, a.key)).length })).filter((a) => a.n > 0).sort((a, b) => b.n - a.n);
  return `<div class="empty"><strong>조건에 맞는 곳이 없습니다.</strong>
    ${tips.length ? `<span class="small">이 조건을 풀면 결과가 생깁니다:</span><div class="fgroup">${tips.map((t) => `<button class="btn" type="button" data-relax="${t.key}">${esc(t.label)} 풀기 → ${t.n}곳</button>`).join('')}</div>` : ''}
    ${!state.f.unknown ? '<span class="small">"미확인도 보기"를 켜면 아직 확인 못 한 곳도 함께 보입니다.</span>' : ''}</div>`;
}

function sortList(list) {
  const by = state.sort;
  return list.sort((a, b) => {
    if (by === 'dist' && state.origin) { const da = dist(a), db = dist(b); if (da !== db) return (da ?? Infinity) - (db ?? Infinity); }
    if (by === 'recruit') { const ra = childClass(a).recruit ?? -1, rb = childClass(b).recruit ?? -1; if (ra !== rb) return rb - ra; }
    if (a.kind !== b.kind) return a.kind === '유치원' ? -1 : 1;
    return a.name.localeCompare(b.name, 'ko');
  });
}

function drawFilters() {
  const g = GROUPS.map((gr) => `<div class="fgroup" role="group" aria-label="${gr.label}"><span class="glabel">${gr.label}</span>${gr.opts.map(([v, l]) => `<button class="chip" type="button" data-g="${gr.key}" data-v="${esc(v)}" aria-pressed="${state.f[gr.key].includes(v)}">${esc(l)}</button>`).join('')}</div>`).join('');
  const c = `<div class="fgroup" role="group" aria-label="조건"><span class="glabel">조건</span>${CONDS.map((cd) => `<button class="chip" type="button" data-c="${cd.key}" aria-pressed="${state.f.cond.includes(cd.key)}">${esc(cd.label)}</button>`).join('')}</div>`;

  const u = `<div class="fgroup"><span class="glabel">미확인</span><button class="chip" type="button" id="unk" aria-pressed="${state.f.unknown}">미확인도 보기</button><button class="btn" type="button" id="reset">조건 모두 지우기</button></div>`;
  $('#filters').innerHTML = `<h2>조건</h2>${g}${c}${r}${u}<div class="rule">같은 줄에서 여러 개를 고르면 하나라도 맞으면 보이고(또는), 줄이 다르면 모두 맞아야 보입니다(그리고). '미확인도 보기'를 켜면 조건을 확인하지 못한 곳도 빼지 않고 '미확인'으로 보여 줍니다.</div>`;

function activeRule() {
  const parts = [];
  for (const g of GROUPS) if (state.f[g.key].length) parts.push(`${g.label}: ${state.f[g.key].map((v) => g.opts.find((o) => o[0] === v)[1]).join(' 또는 ')}`);
  for (const c of CONDS) if (state.f.cond.includes(c.key)) parts.push(c.key === 'radius' ? `반경 ${state.f.radius}km 안` : c.label);
  return parts.length ? `적용 중: ${parts.join(' · 그리고 · ')}${state.f.unknown ? ' (미확인 포함)' : ''}` : '조건 없음 — 전체 보기';
}

function copyRow(label, value, link) {

}

        ${a.recruit.map((r) => `<tr><td>${esc(r.age)}</td><td>${esc(r.birth)}</td><td class="num">${esc(r.classes ?? U)}</td><td class="num">${esc(r.capacity ?? U)}</td><td class="num">${esc(r.staying ?? U)}</td><td class="num"><b>${esc(r.recruit ?? U)}</b></td></tr>`).join('')}

// ── 지원할 3곳 고르기 ──────────────────────────────────
const MUSTS = [
  { key: 'child', label: '우리 아이(출생연도) 반이 있다', why: '반 없음' },
  { key: 'late', label: '18:30 이후까지 돌봄·운영', why: '18:30 전에 끝남' },
  { key: 'bus', label: '통학버스가 있다', why: '버스 없음' },
  { key: 'radius', label: '출발지에서 반경 안 (지도 탭의 반경 사용)', why: '반경 밖' },
  { key: 'free', label: '부모 부담금 없음이 요강에 적혀 있다', why: '' },
];
function mustVal(it, key) {
  if (key === 'free') {
    if (it.kind !== '유치원') return false;
    const c = it.admission?.cost?.text; if (!c) return null;
    return /부담금 없음|부담금 0원|무상|수익자 부담금 없음/.test(c) ? true : null;
  }
  return CONDS.find((c) => c.key === key).val(it);
}
const FAMS = [
  ['multi2', '자녀가 2명 (충남 주소, 18세 미만)'], ['multi3', '자녀가 3명 이상'], ['twins', '쌍둥이(쌍생아)'],
  ['sibling', '형제·자매가 그 유치원에 다니는 중'], ['together', '형제·자매가 함께 입학'], ['walk', '버스 없이 걸어서·직접 등하원 가능'],
  ['local_segyo', '배방읍 세교리 주소'], ['local_handeul', '한들물빛도시 주소 + 버스 미이용'], ['local_gongsu', '아산공수초 학구 안 주소'],
  ['multicultural', '다문화 가정'], ['disabledParent', '장애부모 가정'], ['health', '건강취약 유아'], ['social', '사회적 배려 대상'],
  ['low', '법정저소득층'], ['vet', '국가보훈대상'], ['nk', '북한이탈주민'], ['foreign', '외국국적 유아'],
];
const famLabel = (k) => FAMS.find((f) => f[0] === k)?.[1] ?? k;

function bestPrio(it) {
  const P = it.admission?.prio;
  if (!P) return null;
  const hits = P.filter((p) => p.keys.some((k) => state.fam.includes(k)));
  if (!hits.length) return { none: true, notes: P.filter((p) => p.note).map((p) => p.note) };
  const b = hits.sort((a, c) => a.rank - c.rank)[0];
  return { rank: b.rank, pct: b.pct, why: b.keys.filter((k) => state.fam.includes(k)).map(famLabel), notes: P.filter((p) => p.note).map((p) => p.note), others: hits.slice(1).map((h) => `${h.rank}순위`) };
}

function drawPick() {
  const kinders = DATA.institutions.filter((x) => x.kind === '유치원');
  const res = kinders.map((it) => {
    const r = state.must.map((k) => ({ k, v: mustVal(it, k) }));
    return { it, r, bad: r.filter((x) => x.v === false), unk: r.filter((x) => x.v === null) };
  });
  const ok = res.filter((x) => !x.bad.length && !x.unk.length);
  const unk = res.filter((x) => !x.bad.length && x.unk.length);
  const bad = res.filter((x) => x.bad.length);
  const byDist = (a, b) => (dist(a.it) ?? Infinity) - (dist(b.it) ?? Infinity) || a.it.name.localeCompare(b.it.name, 'ko');
  const row = (x) => {
    const p = bestPrio(x.it); const inPlan = state.plan.indexOf(x.it.id);
    const d = dist(x.it);
    return `<div class="pickrow">
      <div class="row1" style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><strong>${esc(x.it.name)}</strong><span class="small muted">${esc(x.it.area)}${d !== null ? ` · 직선 ${km(d)}` : ''}</span></div>
      <div class="small">${esc(childClass(x.it).text)}</div>
      ${state.must.length ? `<div class="reasons">${x.r.map((y) => { const m = MUSTS.find((mm) => mm.key === y.k); return `<span class="rs ${y.v === true ? 'ok' : y.v === false ? 'no' : 'unk'}">${y.v === true ? '충족' : y.v === false ? '불충족' : '미확인'}: ${esc(m.label.replace(' (지도 탭의 반경 사용)', ''))}</span>`; }).join('')}</div>` : ''}
      <div class="prio">${!x.it.admission?.read ? '<span class="muted">우선순위: 요강 미확인</span>' : !state.fam.length ? '<span class="muted">왼쪽에서 우리 가족 조건을 고르면 해당 순위를 보여 줍니다</span>' : p.none ? '우선순위: 해당 조건 없음 → 우선모집 일반 대상이 아니면 일반모집' : `우선순위: <b>${p.rank}순위</b> (${esc(p.pct ?? '비율 미확인')}) — ${esc(p.why.join(', '))}${p.others.length ? ` <span class="muted">(다른 해당: ${esc(p.others.join(', '))})</span>` : ''}`}
        ${p?.notes?.length ? `<div class="small muted">${esc(p.notes.join(' / '))}</div>` : ''}</div>
      <div class="acts" style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="btn${inPlan >= 0 ? ' primary' : ''}" type="button" data-plan="${esc(x.it.id)}" ${inPlan < 0 && state.plan.length >= 3 ? 'disabled' : ''}>${inPlan >= 0 ? `${inPlan + 1}희망 · 빼기` : '희망 목록에 넣기'}</button>
        <button class="btn" type="button" data-open="${esc(x.it.id)}">상세</button>
        <button class="btn" type="button" data-ask="${esc(x.it.id)}">질문지</button>
      </div></div>`;
  };
  const planItems = state.plan.map((id) => DATA.institutions.find((x) => x.id === id)).filter(Boolean);
  $('#view-pick').innerHTML = `<div class="cols2">
    <div class="stack">
      <div class="panel checks"><h2>꼭 필요한 조건</h2>
        <p class="small muted" style="margin:0">하나라도 '불충족'이면 아래 '조건 불충족'으로 갑니다. 다른 장점으로 메우지 않습니다. 확인 못 한 조건은 '확인 필요'로 따로 모읍니다.</p>
        ${MUSTS.map((m) => `<label><input type="checkbox" data-must="${m.key}" ${state.must.includes(m.key) ? 'checked' : ''}> ${esc(m.label)}</label>`).join('')}
        ${state.must.includes('radius') && !state.origin ? '<p class="small" style="margin:0;color:var(--warn-ink)">출발지가 없어 반경은 모두 미확인입니다. 지도 탭에서 지도를 눌러 출발지를 정하세요.</p>' : ''}
      </div>
      <div class="panel checks"><h2>우리 가족에게 해당하는 것</h2>
        <p class="small muted" style="margin:0">유치원마다 우선모집 몇 순위로 지원하게 되는지 요강을 근거로 보여 줍니다. 이 기기에만 저장됩니다. 비율은 모집인원 대비 선발 비율이며 합격 가능성이 아닙니다. 조건이 여러 개여도 지원할 때는 1가지만 고릅니다.</p>
        ${FAMS.map(([k, l]) => `<label><input type="checkbox" data-fam="${k}" ${state.fam.includes(k) ? 'checked' : ''}> ${esc(l)}</label>`).join('')}
      </div>
      <div class="panel plan"><h2>내 희망 순서 (최대 3곳)</h2>
        ${planItems.length ? `<ol>${planItems.map((it) => `<li>${esc(it.name)} <span class="small muted">${esc(childClass(it).text)}</span></li>`).join('')}</ol>` : '<p class="small muted" style="margin:0">오른쪽 목록에서 "희망 목록에 넣기"를 누르세요.</p>'}
        ${planItems.length > 1 ? '<div class="fgroup"><button class="btn" type="button" id="planUp">2희망을 1희망으로 올리기</button><button class="btn" type="button" id="planClear">비우기</button></div>' : planItems.length ? '<div class="fgroup"><button class="btn" type="button" id="planClear">비우기</button></div>' : ''}
        <p class="small muted" style="margin:0">계획 메모일 뿐 실제 접수가 아닙니다. 접수는 유보통합포털에서 <b>11월 2일(월) 9시 ~ 4일(수) 18시</b>. 우선모집은 희망순 추첨이고, 선발되어 등록하면 일반모집에 지원할 수 없습니다.</p>
      </div>
    </div>
    <div class="stack">
      <div class="panel bucket"><h3>조건을 모두 충족 <span class="cnt">${ok.length}</span></h3>${ok.sort(byDist).map(row).join('') || '<p class="small muted">없음</p>'}</div>

      <p class="small muted">영어유치원(학원)은 유보통합포털 지원 대상이 아니라 이 목록에 넣지 않았습니다. 학원에 직접 문의하세요.</p>
    </div></div>`;
}

// ── 질문지 ────────────────────────────────────────────
function questions(it) {
  const q = [];
  const add = (key, text, why) => q.push({ key, text, why });
  if (it.kind === '유치원') {
    const a = it.admission;
    if (!a?.read) add('yogang', '2027학년도 우리 아이 출생연도 반 모집 인원과 우선모집 순위는 어떻게 되나요?', '요강 미확인');
    if (!a?.classNames) add('classname', `${state.birth}년생이 들어가는 반을 원에서는 뭐라고 부르나요? (반 이름·학급 수)`, '반 이름 미확인');

  if (life?.meal) q.push(['meal', '식사할 때 천천히 먹거나 도움이 필요한 아이는 어떻게 도와주시나요? 편식은 어떻게 지도하나요?']);
  if (life?.toilet || life?.newtoilet) q.push(['toilet', '배변·옷 갈아입기 도움은 어디까지 해 주시나요? 처음에 화장실 적응은 어떻게 돕나요?']);
  if (life?.commute) q.push(['commute', '버스 탑승 시간이 가장 긴 아이는 몇 분 타나요? 우리 집 쪽은 몇 분쯤인가요?']);

}
function kidQuestions() {
  const k = curKid(); if (!k) return [];
  const rec = [...k.records].filter((r) => r.by === '부모').sort((a, b) => b.date.localeCompare(a.date))[0] ?? k.records[k.records.length - 1];
  if (!rec) return [];
  const an = analyze(rec);
  const picks = rec.picks ?? [];
  const keys = Object.keys(an.sup).sort((a, b) => (picks.includes(b) ? 1 : 0) - (picks.includes(a) ? 1 : 0));
  const out = keys.map((s) => ({ key: 'kid_' + s, text: SUPPORTS[s].q, why: `${k.nick} 설문 — ${SUPPORTS[s].name}${picks.includes(s) ? ' ★부모가 중요하다고 고름' : ''}` }));
  for (const [key, text] of lifeQuestions(rec.life)) out.push({ key: 'kidlife_' + key, text, why: `${k.nick} 생활 질문` });
  return out;
}
