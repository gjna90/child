<title>배방·탕정 유치원 지도</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* 레이아웃: 왼쪽 지도·조건, 오른쪽 목록 (좁은 화면은 위→아래로 쌓음). 동네 지도 색감: 논·하천 초록 바탕에 기관 점 */
:root {
  --bg: #f4f6f2;
  --surface: #ffffff;
  --ink: #1d2925;
  --muted: #5d6b65;
  --line: #d6ddd7;
  --land: #e6ece4;
  --land-focus: #d5e6d8;
  --accent: #0e6a62;
  --accent-ink: #ffffff;
  --public: #0e6a62;
  --private: #b8681a;
  --academy: #6650a8;
  --daycare: #2f6aa8;
  --warn-bg: #fff4dc;
  --warn-ink: #7a4b00;
  --ok-bg: #e2f2ea;
  --ok-ink: #135c3a;
  --unk-bg: #eceee9;
  --unk-ink: #5d6b65;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-display: "Gowun Dodum", "IBM Plex Sans KR", "Apple SD Gothic Neo", sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121816; --surface: #1a2220; --ink: #e5ece8; --muted: #9aa9a2; --line: #2e3a36;
    --land: #1e2724; --land-focus: #223a31; --accent: #4fb8a9; --accent-ink: #0b1513;
    --public: #4fb8a9; --private: #e09a4e; --academy: #a291e0; --daycare: #7fb0e6;
    --warn-bg: #3a2e14; --warn-ink: #f2cc80; --ok-bg: #173527; --ok-ink: #8fd9b2; --unk-bg: #252d2a; --unk-ink: #9aa9a2;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121816; --surface: #1a2220; --ink: #e5ece8; --muted: #9aa9a2; --line: #2e3a36;
  --land: #1e2724; --land-focus: #223a31; --accent: #4fb8a9; --accent-ink: #0b1513;
  --public: #4fb8a9; --private: #e09a4e; --academy: #a291e0; --daycare: #7fb0e6;
  --warn-bg: #3a2e14; --warn-ink: #f2cc80; --ok-bg: #173527; --ok-ink: #8fd9b2; --unk-bg: #252d2a; --unk-ink: #9aa9a2;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
tr.me td { background: rgba(80, 120, 255, .10); font-weight: 600; }
.tag.sty { background: rgba(46, 140, 90, .14); color: var(--ink); }
.tag.sty.weak { background: transparent; border: 1px solid rgba(46, 140, 90, .35); }
.linkbtn { background: none; border: 0; padding: 0; color: inherit; text-decoration: underline; cursor: pointer; font: inherit; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 96px; max-width: 1280px; margin: 0 auto; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: 1.7rem; margin: 0; text-wrap: balance; }
h2 { font-size: 1.05rem; margin: 0; text-wrap: balance; }
h3 { font-size: .95rem; margin: 0; }
.muted { color: var(--muted); }
.small { font-size: .82rem; }
.num { font-variant-numeric: tabular-nums; }
header.top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: end; justify-content: space-between; margin-bottom: 14px; }
.child { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 12px; }
.child label { font-weight: 600; font-size: .85rem; }
select, input[type="range"] { font: inherit; }
select { max-width: 100%; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.notice { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .82rem; color: var(--muted); margin-bottom: 14px; }
.notice b { color: var(--ink); font-weight: 600; }
.layout { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 18px; align-items: start; }
@media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; min-width: 0; }
.stack { display: grid; gap: 14px; min-width: 0; }
.mapbox svg { width: 100%; height: auto; display: block; touch-action: manipulation; cursor: crosshair; border-radius: 8px; background: var(--bg); }
.maphead { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: .8rem; color: var(--muted); }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
.btn { font: inherit; font-size: .85rem; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 5px 12px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn:focus-visible, .chip:focus-visible, select:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn[disabled] { opacity: .5; cursor: default; }
.filters { display: grid; gap: 10px; }
.fgroup { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.fgroup > .glabel { font-size: .78rem; color: var(--muted); width: 3.6rem; flex: none; letter-spacing: .02em; }
.chip { font: inherit; font-size: .84rem; padding: 4px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.rule { font-size: .8rem; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 8px; }
.listhead { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.cards { display: grid; gap: 10px; }
.card { border: 1px solid var(--line); border-radius: var(--r); padding: 12px; background: var(--surface); display: grid; gap: 6px; }
.card.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.card .row1 { display: flex; gap: 8px; align-items: baseline; justify-content: space-between; flex-wrap: wrap; }
.card .name { font-weight: 600; font-size: 1rem; background: none; border: 0; padding: 0; color: var(--ink); cursor: pointer; text-align: left; font-family: inherit; }
.card .name:hover { text-decoration: underline; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tag { font-size: .74rem; padding: 1px 7px; border-radius: 4px; background: var(--unk-bg); color: var(--unk-ink); white-space: nowrap; }
.tag.pub { background: color-mix(in srgb, var(--public) 16%, transparent); color: var(--public); }
.tag.pri { background: color-mix(in srgb, var(--private) 18%, transparent); color: var(--private); }
.tag.dc { background: color-mix(in srgb, var(--daycare) 18%, transparent); color: var(--daycare); }
.tag.lim { background: var(--warn-bg); color: var(--warn-ink); }
.tag.aca { background: color-mix(in srgb, var(--academy) 18%, transparent); color: var(--academy); }
.state { font-size: .84rem; padding: 2px 8px; border-radius: 6px; display: inline-block; }
.state.ok { background: var(--ok-bg); color: var(--ok-ink); }
.state.warn { background: var(--warn-bg); color: var(--warn-ink); }
.state.unk { background: var(--unk-bg); color: var(--unk-ink); }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 4px 14px; font-size: .84rem; }
.facts div { min-width: 0; }
.facts dt { color: var(--muted); font-size: .74rem; }
.facts dd { margin: 0; }
.card .acts { display: flex; gap: 6px; flex-wrap: wrap; }
.empty { padding: 16px; border: 1px dashed var(--line); border-radius: var(--r); display: grid; gap: 8px; }
.detail { display: grid; gap: 12px; }
.detail section { display: grid; gap: 6px; border-top: 1px solid var(--line); padding-top: 10px; }
.detail ul { margin: 0; padding-left: 1.1rem; }
.src { font-size: .76rem; color: var(--muted); }
.copyrow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: .86rem; }
.copyrow code { font-family: inherit; background: var(--unk-bg); padding: 1px 6px; border-radius: 4px; word-break: break-all; user-select: all; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .84rem; }
th, td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
th { color: var(--muted); font-weight: 500; white-space: nowrap; }
.cmpbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--surface); border-top: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.cmpbar .items { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; min-width: 0; }
.overlay { position: fixed; inset: 0; z-index: 20; background: color-mix(in srgb, var(--ink) 40%, transparent); display: grid; place-items: start center; overflow-y: auto;
  padding: calc(16px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 24px max(12px, env(safe-area-inset-left, 0px)); }
.sheet { background: var(--surface); color: var(--ink); border-radius: 14px; width: min(1000px, 100%); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.sheet .bar { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 14px; overflow-x: auto; }
.tab { font: inherit; font-size: .92rem; background: none; border: 0; border-bottom: 3px solid transparent; padding: 8px 12px; color: var(--muted); cursor: pointer; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.cols2 > * { min-width: 0; }
.cols2 { display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 7fr); gap: 18px; align-items: start; }
@media (max-width: 860px) { .cols2 { grid-template-columns: minmax(0, 1fr); } }
.checks { display: grid; gap: 6px; grid-template-columns: minmax(0, 1fr); }
.checks select { width: 100%; }
.checks label { display: flex; gap: 8px; align-items: flex-start; font-size: .9rem; cursor: pointer; }
.checks input { margin-top: 4px; accent-color: var(--accent); }
.bucket { display: grid; gap: 8px; }
.bucket > h3 { display: flex; gap: 8px; align-items: center; }
.cnt { font-size: .78rem; background: var(--unk-bg); color: var(--unk-ink); border-radius: 999px; padding: 0 8px; font-weight: 500; }
.pickrow { border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; display: grid; gap: 6px; }
.reasons { display: flex; flex-wrap: wrap; gap: 4px; font-size: .78rem; }
.rs { padding: 1px 7px; border-radius: 4px; }
.rs.ok { background: var(--ok-bg); color: var(--ok-ink); }
.rs.no { background: var(--warn-bg); color: var(--warn-ink); }
.rs.unk { background: var(--unk-bg); color: var(--unk-ink); }
.prio { font-size: .86rem; }
.plan { display: grid; gap: 6px; }
.plan ol { margin: 0; padding-left: 1.3rem; }
.qlist { display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; }
.qlist label { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; font-size: .9rem; }
.qlist input { margin-top: 4px; accent-color: var(--accent); }
textarea { font: inherit; width: 100%; min-height: 70px; border: 1px solid var(--line); border-radius: 8px; padding: 8px; background: var(--surface); color: var(--ink); }
.survey { display: grid; gap: 10px; }
.qitem { border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; display: grid; gap: 6px; }
.qitem .qt { font-size: .93rem; }
.qitem .qn { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 4px; }
.opts { display: flex; flex-wrap: wrap; gap: 4px; }
.opts label { font-size: .82rem; border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; cursor: pointer; display: inline-flex; gap: 4px; align-items: center; }
.opts input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.opts label:has(input:checked) { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.opts label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.qitem input[type="text"], .lifeq input, .lifeq textarea, .kidform input { font: inherit; font-size: .88rem; width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; background: var(--surface); color: var(--ink); }
.lifeq { display: grid; gap: 4px; }
.lifeq label { font-size: .86rem; font-weight: 500; }
.kidlist { display: grid; gap: 6px; }
.kidbtn { font: inherit; text-align: left; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 8px 10px; cursor: pointer; }
.kidbtn[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.kidform { display: grid; gap: 6px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; align-items: end; }
.res { display: grid; gap: 12px; }
.res section { border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 4px; }
.res ul { margin: 0; padding-left: 1.1rem; }
.diff { font-size: .82rem; color: var(--warn-ink); }
.progress { font-size: .82rem; color: var(--muted); }
.crits { display: grid; gap: 6px; }
.crit { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 6px; align-items: center; font-size: .88rem; }
.crit select { font-size: .82rem; padding: 2px 4px; }
.mini { font: inherit; font-size: .78rem; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 6px; padding: 1px 6px; cursor: pointer; }
.params { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.params label { font-size: .8rem; color: var(--muted); display: grid; gap: 2px; }
.params input, .params select { font: inherit; font-size: .88rem; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); width: 100%; }
.rcard { border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; gap: 6px; }
.rcard .rk { font-variant-numeric: tabular-nums; color: var(--muted); font-size: .85rem; margin-right: 6px; }
.score { font-size: .85rem; }
.score b { font-size: 1.05rem; font-variant-numeric: tabular-nums; }
.cv { font-size: .76rem; padding: 1px 7px; border-radius: 4px; }
.cv.g { background: var(--ok-bg); color: var(--ok-ink); }
.cv.m { background: var(--unk-bg); color: var(--ink); }
.cv.b { background: var(--warn-bg); color: var(--warn-ink); }
.cv.u { background: var(--unk-bg); color: var(--unk-ink); font-style: italic; }
.rlist { margin: 0; padding-left: 1.1rem; font-size: .86rem; }
details.panel summary { cursor: pointer; font-weight: 600; }
footer { margin-top: 24px; font-size: .8rem; color: var(--muted); display: grid; gap: 4px; }
svg text { font-family: var(--font-body); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>배방·탕정 유치원 지도</h1>
      <div class="muted small">유치원 공식 공시와 2027학년도 모집요강, 영어유치원(학원) 등록 자료를 한곳에서 비교합니다</div>
    </div>
    <div class="child">
      <label for="birth">우리 아이 출생연도</label>
      <select id="birth"></select>
      <span id="childLabel" class="small"></span>
      <span id="saveState" class="small muted" style="width:100%"></span>
    </div>
  </header>

  <div class="notice" id="notice"></div>

  <nav class="tabs" role="tablist" aria-label="화면">
    <button class="tab" role="tab" id="tab-map" data-tab="map" type="button">지도·목록</button>
    <button class="tab" role="tab" id="tab-pick" data-tab="pick" type="button">지원할 3곳 고르기</button>
    <button class="tab" role="tab" id="tab-ask" data-tab="ask" type="button">전화·상담 질문지</button>
    <button class="tab" role="tab" id="tab-kid" data-tab="kid" type="button">우리 아이 성향·생활 알아보기</button>
    <button class="tab" role="tab" id="tab-reco" data-tab="reco" type="button">맞춤 추천</button>
    <button class="tab" role="tab" id="tab-cal" data-tab="cal" type="button">설명회·모집 달력</button>
    <button class="tab" role="tab" id="tab-me" data-tab="me" type="button">내 기록 관리</button>
  </nav>

  <div id="view-pick" hidden></div>
  <div id="view-ask" hidden></div>
  <div id="view-kid" hidden></div>
  <div id="view-reco" hidden></div>
  <div id="view-cal" hidden></div>
  <div id="view-me" hidden></div>

  <div class="layout" id="view-map">
    <div class="stack">
      <div class="panel mapbox">
        <div class="maphead">
          <h2>지도</h2>
          <div class="fgroup">
            <label for="aptInput" class="small muted">우리 아파트</label>
            <input id="aptInput" list="aptList" placeholder="단지 이름 입력" style="font:inherit;font-size:.85rem;padding:4px 8px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);max-width:12rem">
            <datalist id="aptList"></datalist>
            <button class="btn" id="geoBtn" type="button">현재 위치로 출발지</button>
            <button class="btn" id="clearOrigin" type="button" hidden>출발지 지우기</button>
          </div>
        </div>
        <div id="map"></div>
        <div class="legend" style="margin-top:8px">
          <span><span class="dot" style="background:var(--public)"></span>공립 유치원</span>
          <span><span class="dot" style="background:var(--private)"></span>사립 유치원</span>
          <span><span class="dot" style="background:var(--daycare)"></span>어린이집</span>
          <span><span class="dot" style="background:var(--academy)"></span>영어유치원·학원</span>
          <span><span class="dot" style="background:var(--ink)"></span>출발지</span>
        </div>
        <p class="small muted" id="mapNote" style="margin:6px 0 0"></p>
      </div>

      <div class="panel filters" id="filters" aria-label="조건"></div>
    </div>

    <div class="stack">
      <div class="panel">
        <div class="listhead">
          <h2 id="count"></h2>
          <div class="fgroup">
            <label for="sort" class="small muted">정렬</label>
            <select id="sort">
              <option value="dist">직선거리 가까운 순</option>
              <option value="recruit">2027 모집인원 많은 순</option>
              <option value="name">이름순</option>
            </select>
          </div>
        </div>
        <div class="small muted" id="activeRule" style="margin-bottom:10px"></div>
        <div class="cards" id="cards"></div>
      </div>
    </div>
  </div>

  <footer id="foot"></footer>
</div>

<div class="cmpbar" id="cmpbar" hidden>
  <strong class="small">비교함</strong>
  <div class="items" id="cmpItems"></div>
  <button class="btn primary" id="cmpOpen" type="button">나란히 비교</button>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="bar"><h2 id="sheetTitle"></h2><button class="btn" id="sheetClose" type="button">닫기</button></div>
    <div id="sheetBody"></div>
  </div>

// 4단계 추천 계산 (명시적 규칙만 사용. AI는 결과 설명에만 씀) — 규칙 문서: docs/07_추천_규칙.md
// 이 파일은 node 테스트와 화면(app) 양쪽에서 쓴다. 화면에는 build-app.js가 export를 지워 끼워 넣는다.
// 값 규칙: 기준별 값은 0~1, 모르면 null. null은 계산에서 빼고 '미확인'으로 표시한다(0으로 바꾸지 않음).

const WEIGHTS = { '매우 중요': 3, 중요: 2, 참고: 1 };
const MIN_COVERAGE = 0.5; // 정보 확인 정도가 이보다 낮으면 '정보 부족' 묶음

/** good일 때 1, bad일 때 0, 사이는 직선. good<bad(작을수록 좋음)·good>bad(클수록 좋음) 모두 지원 */
function linear(x, good, bad) {
  if (x === null || x === undefined || !Number.isFinite(x)) return null;
  if (good === bad) return x === good ? 1 : 0;
  const t = (x - bad) / (good - bad);
  return Math.max(0, Math.min(1, t));
}

/** 비용: 예산의 50% 이하=1, 예산=0.3, 그 사이 직선, 예산 초과=0 (예산 초과는 필수 조건에서 따로 처리) */
function costValue(monthly, budget) {
  if (monthly === null || monthly === undefined || !budget) return null;
  if (monthly <= budget * 0.5) return 1;
  if (monthly > budget) return 0;
  return 1 - 0.7 * ((monthly - budget * 0.5) / (budget * 0.5));
}

/**
 * 종합 비교 지표
 * @param {{key:string, weight:number, value:number|null}[]} crit
 * @returns {{index:number|null, coverage:number, confirmed:number, total:number}}
 *   index = Σ(가중치×값) ÷ Σ(확인된 기준의 가중치) × 100,  coverage = Σ(확인된 가중치) ÷ Σ(전체 가중치)
 */
function composite(crit) {
  const total = crit.reduce((a, c) => a + c.weight, 0);
  const known = crit.filter((c) => c.value !== null && c.value !== undefined);
  const confirmed = known.reduce((a, c) => a + c.weight, 0);
  const index = confirmed ? (known.reduce((a, c) => a + c.weight * c.value, 0) / confirmed) * 100 : null;
  return { index: index === null ? null : Math.round(index * 10) / 10, coverage: total ? confirmed / total : 0, confirmed, total };
}

/** 필수 조건 결과 묶기: 불충족 하나라도 → fail, 아니면 미확인 하나라도 → check, 모두 충족 → pass */
function mustStatus(results) {
  if (results.some((r) => r.value === false)) return 'fail';
  if (results.some((r) => r.value === null || r.value === undefined)) return 'check';
  return 'pass';
}

const byName = (a, b) => String(a.name).localeCompare(String(b.name), 'ko');
const num = (x, d) => (x === null || x === undefined ? d : x);

/**
 * 종합 추천 정렬. items: [{id,name,distance(m|null), crit:[...]}]
 * 확인 정도 50% 미만은 lack 묶음으로 보내 상위에 올리지 않음. 동점: 확인 정도 높은 순 → 거리 가까운 순 → 이름순
 */
function rankComposite(items) {
  const scored = items.map((it) => ({ ...it, score: composite(it.crit) }));
  const main = scored.filter((x) => x.score.index !== null && x.score.coverage >= MIN_COVERAGE);
  const lack = scored.filter((x) => !(x.score.index !== null && x.score.coverage >= MIN_COVERAGE));
  const cmp = (a, b) => (num(b.score.index, -1) - num(a.score.index, -1)) || (b.score.coverage - a.score.coverage) || (num(a.distance, Infinity) - num(b.distance, Infinity)) || byName(a, b);
  return { main: main.sort(cmp), lack: lack.sort(cmp) };
}

/**
 * 우선순위대로 정렬. order: 기준 키 순서. bins: {키: (값0~1) => 묶음 번호(클수록 좋음)}
 * 1순위 기준의 묶음 → 같은 묶음 안에서 2순위 → … 그 기준이 미확인이면 그 단계에서 순위를 매기지 않고 뒤로(미확인 표시).
 */
function rankPriority(items, order, bins = {}) {
  const val = (it, k) => it.crit.find((c) => c.key === k)?.value ?? null;
  const bin = (k, v) => (v === null ? null : (bins[k] ? bins[k](v) : Math.round(v * 10)));
  return [...items].sort((a, b) => {
    for (const k of order) {
      const x = bin(k, val(a, k)), y = bin(k, val(b, k));
      if (x === null && y === null) continue;
      if (x === null) return 1;
      if (y === null) return -1;
      if (x !== y) return y - x;
    }
    return (num(a.distance, Infinity) - num(b.distance, Infinity)) || byName(a, b);
  });
}

/**
 * 가족 전체 보기: 모든 아이가 필수 조건을 통과해야 pass. 한 아이라도 fail이면 fail, 아니면 하나라도 check면 check.
 * 종합 지표는 아이들 중 가장 낮은 값으로 정렬(한 아이의 약점이 다른 아이의 장점에 가려지지 않도록).
 */
function familyStatus(perKid) {
  if (perKid.some((s) => s === 'fail')) return 'fail';
  if (perKid.some((s) => s === 'check')) return 'check';
  return 'pass';
}

    if (/상생발전|차\s*례|\d{1,3}\s*\n\s*\d+\.\s/.test(seg.slice(0, 200))) continue; // 교육청 공통 비전·목차 제외
    out.push(seg);
  }
  return out;
}

/** 바깥놀이·숲 활동 빈도 문장 (예: '바깥놀이 매일 60분 이상', '매주 금요일 숲데이') */
function outdoorLines(text) {
  const t = norm(text).replace(/\n/g, ' ');
  const re = /[^.。▸◦•\-/]{0,30}(?:바깥\s*놀이|숲\s*(?:데이|체험|놀이)|실외\s*놀이)[^.。▸◦•/]{0,30}/g;
  const freq = /(매일|1일\s*\d|하루\s*\d|주\s*\d\s*회|매주|월\s*\d\s*회|매월|\d+\s*분\s*이상|\d\s*시간\s*이상)/;
  const seen = new Set();
  return [...t.matchAll(re)].map((x) => x[0].trim()).filter((s) => freq.test(s) && !seen.has(s) && seen.add(s)).slice(0, 6);
}

/** 운영계획 글 → { scores, tags, outdoor, focusCount } */
function analyzePlan(text) {
  const t = norm(text);
  const focus = focusSections(t).join('\n');
  const scores = {};
  for (const [k, s] of Object.entries(STYLES)) {
    const body = s.words.reduce((a, w) => a + count(t, w), 0);
    const f = s.words.reduce((a, w) => a + count(focus, w), 0);
    scores[k] = Math.round((Math.log1p(body) + 3 * Math.log1p(f)) * 10) / 10;
  }
  const focusCount = focusSections(t).length;
  // 학사일정만 올린 짧은 문서는 분류하지 않음(일정표의 '숲체험' 몇 번으로 방향을 단정하지 않기)
  const enough = t.length >= 8000 && focusCount > 0;
  return { scores, tags: enough ? tagsFromScores(scores) : [], outdoor: outdoorLines(t), focusCount, chars: t.length, note: enough ? null : '교육방침·중점교육이 없는 문서(학사일정 등) — 분류하지 않음' };
}

/** 점수 → 기관 안에서 상대적으로 두드러진 방향(최대 3개)만 '강조' */

/** 원하는 방향들과 기관 분류의 맞춤 정도 0~1 (강조 1, 언급 0.5, 적음 0). 분류가 없으면 null */

  { key: 'child', label: '우리 아이 반 있음', val: (it) => childClass(it).known },
  { key: 'yogang', label: '2027 요강 확인됨', val: (it) => (it.kind === '유치원' ? !!it.admission?.read : false) },
  { key: 'bus', label: '통학버스 운영', val: busKnown },
  { key: 'late', label: '18:30 이후까지 돌봄·운영', val: (it) => { const e = lateEnd(it); return e === null ? null : e >= '18:30'; } },
  { key: 'radius', label: '출발지 반경 안', val: (it) => { if (!state.origin) return null; const d = dist(it); return d === null ? null : d <= state.f.radius * 1000; } },
];

function passes(it, skip) {
  for (const g of GROUPS) {
    if (skip === g.key) continue;
    const sel = state.f[g.key] ?? [];
    if (sel.length && !sel.some((v) => g.test(it, v))) return false; // 같은 범주: OR
  }
  for (const c of CONDS) {
    if (skip === c.key || !state.f.cond.includes(c.key)) continue; // 다른 범주: AND
    const v = c.val(it);
    if (v === false) return false;
    if (v === null && !state.f.unknown) return false;
  }
  return true;
}

// ── 지도 ──────────────────────────────────────────────
const MAP = (() => {
  const focus = DATA.map.areas.filter((a) => a.focus);
  let minX = 180, maxX = -180, minY = 90, maxY = -90;
  for (const a of focus) for (const ring of a.rings) for (const [x, y] of ring) { minX = Math.min(minX, x); maxX = Math.max(maxX, x); minY = Math.min(minY, y); maxY = Math.max(maxY, y); }
  const padX = (maxX - minX) * 0.06, padY = (maxY - minY) * 0.06;
  minX -= padX; maxX += padX; minY -= padY; maxY += padY;
  const kx = Math.cos(((minY + maxY) / 2) * Math.PI / 180);
  const W = 1000, H = Math.round((W * (maxY - minY)) / ((maxX - minX) * kx));
  const px = (lng) => ((lng - minX) / (maxX - minX)) * W;
  const py = (lat) => ((maxY - lat) / (maxY - minY)) * H;
  const inv = (x, y) => ({ lng: minX + (x / W) * (maxX - minX), lat: maxY - (y / H) * (maxY - minY) });
  return { W, H, px, py, inv };
})();

function centroid(ring) { let x = 0, y = 0; for (const p of ring) { x += p[0]; y += p[1]; } return [x / ring.length, y / ring.length]; }

function drawMap(list) {
  const { W, H, px, py } = MAP;
  const path = (ring) => 'M' + ring.map(([x, y]) => `${px(x).toFixed(1)},${py(y).toFixed(1)}`).join('L') + 'Z';
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="배방읍·탕정면 지도. 지도를 누르면 출발지가 정해집니다" id="svgmap">`;
  s += `<rect x="0" y="0" width="${W}" height="${H}" fill="var(--bg)"/>`;
  for (const a of DATA.map.areas) {
    for (const r of a.rings) s += `<path d="${path(r)}" fill="${a.focus ? 'var(--land-focus)' : 'var(--land)'}" stroke="var(--line)" stroke-width="${a.focus ? 2 : 1}"/>`;
  }
  for (const a of DATA.map.areas) {
    const big = a.rings.reduce((m, r) => (r.length > m.length ? r : m), a.rings[0]);
    const [cx, cy] = centroid(big);
    const x = px(cx), y = py(cy);
    if (x < 20 || x > W - 20 || y < 20 || y > H - 20) continue;
    s += `<text x="${x.toFixed(0)}" y="${y.toFixed(0)}" text-anchor="middle" font-size="${a.focus ? 30 : 20}" fill="var(--muted)" opacity="${a.focus ? .75 : .5}" pointer-events="none">${esc(a.name)}</text>`;
  }
  const shown = new Set(list.map((x) => x.id));
  const pts = DATA.institutions.filter((it) => it.lat);
  for (const it of pts) {
    const x = px(it.lng), y = py(it.lat);
    if (x < 0 || x > W || y < 0 || y > H) continue;
    const col = isDc(it) ? 'var(--daycare)' : it.kind !== '유치원' ? 'var(--academy)' : it.isPublic ? 'var(--public)' : 'var(--private)';
    const on = shown.has(it.id), sel = state.sel === it.id;
    s += `<g class="pin" data-id="${esc(it.id)}" tabindex="0" role="button" aria-label="${esc(it.name)}" style="cursor:pointer" opacity="${on ? 1 : .25}">`
      + `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${sel ? 15 : 10}" fill="${col}" stroke="var(--surface)" stroke-width="3"/>`
      + (sel ? `<text x="${x.toFixed(1)}" y="${(y - 22).toFixed(1)}" text-anchor="middle" font-size="24" font-weight="600" fill="var(--ink)" stroke="var(--surface)" stroke-width="6" paint-order="stroke">${esc(it.name.replace('초등학교병설유치원', '초 병설'))}</text>` : '')
      + `<title>${esc(it.name)}</title></g>`;
  }
  if (state.origin) {
    const x = px(state.origin.lng), y = py(state.origin.lat);
    s += `<g pointer-events="none"><circle cx="${x}" cy="${y}" r="13" fill="none" stroke="var(--ink)" stroke-width="4"/><circle cx="${x}" cy="${y}" r="4" fill="var(--ink)"/></g>`;
  }
  s += '</svg>';
  $('#map').innerHTML = s;
  const svg = $('#svgmap');
  svg.addEventListener('click', (e) => {
    const pin = e.target.closest('.pin');
    if (pin) { select(pin.dataset.id, true); return; }
    const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    const p = pt.matrixTransform(svg.getScreenCTM().inverse());
    setOrigin({ ...MAP.inv(p.x, p.y), how: '지도에서 지정' });
  });
  svg.addEventListener('keydown', (e) => { const pin = e.target.closest('.pin'); if (pin && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); select(pin.dataset.id, true); } });
  const noLoc = DATA.institutions.filter((it) => !it.lat);
  $('#mapNote').textContent = `${state.origin?.aptId ? `출발지: ${state.origin.name} — 도보·자동차 시간은 카카오 경로로 미리 계산한 값입니다. ` : '아파트 단지를 고르면 도보·자동차 시간이 나옵니다. 지도를 눌러도 출발지가 되지만 그때는 직선거리만 계산합니다. '}점은 유치원알리미 공시 좌표(없으면 주소로 찾은 좌표)입니다.${noLoc.length ? ` 위치를 못 찾은 곳 ${noLoc.length}곳.` : ''}`;
}

// 아파트 → 기관 도보·자동차 (미리 계산한 값). 아파트를 고르지 않았으면 null
const INST_IDX = new Map(DATA.institutions.map((x, i) => [x.id, i]));
function routeOf(it) {
  const a = state.origin?.aptId; if (!a) return null;
  const r = DATA.aptRoutes?.[a]?.[INST_IDX.get(it.id)]; if (!r) return { none: true };
  return { walkM: r[0], walkMin: r[1] === null ? null : Math.round(r[1] / 60), carM: r[2], carMin: r[3] === null ? null : Math.max(1, Math.round(r[3] / 60)) };
}
function routeText(it) {
  const d = dist(it);
  if (d === null) return state.origin ? '위치 없음' : '출발지 미정';
  const r = routeOf(it); const line = `직선 ${km(d)}`;
  if (!r) return line;
  if (r.none) return `${line} · 경로 미계산(먼 곳)`;
  return `${line}${r.walkMin !== null ? ` · 도보 ${r.walkMin}분` : ''}${r.carMin !== null ? ` · 차 ${r.carMin}분` : ''}`;
}
function setOrigin(o) { state.origin = o; store.set('origin', o); if (state.sort !== 'dist') {} render(); }

// ── 목록·카드 ──────────────────────────────────────────
const typeTag = (it) => (isDc(it) ? `<span class="tag dc">어린이집 · ${esc(it.type ?? U)}</span>${it.restriction ? '<span class="tag lim">이용 자격 제한</span>' : ''}` : it.kind !== '유치원' ? '<span class="tag aca">영어유치원·학원</span>' : it.isPublic ? `<span class="tag pub">${esc(it.type)}</span>` : `<span class="tag pri">${esc(it.type)}</span>`);

function hoursText(it) {
  if (it.kind !== '유치원') return U;
  return it.hoursPub ? `${it.hoursPub} (공시, 방과후 포함)` : U;
}
function careText(it) {
  const c = it.admission?.care?.text;
  if (!c) { const h = it.admission?.hours?.text; return h && /07:30~19:30/.test(h) ? '운영시간 안에 포함(요강)' : U; }
  const t = [...c.matchAll(/(\d{2}:\d{2})~(\d{2}:\d{2})/g)].map((m) => m[0]);
  return t.length ? t.join(', ') : c.slice(0, 30);
}
function busText(it) {
  if (isDc(it)) return it.busPub?.operating ? `${it.busPub.operating} (공시)` : U;
  if (it.kind !== '유치원') return U;
  const t = it.admission?.bus?.text;
  if (t) return /^(없음|미운행)/.test(t) ? t.split(' ')[0] : '운행 (노선은 상세)';
  if (it.busPub) return `${it.busPub.operating}${it.busPub.count ? ` ${it.busPub.count}대` : ''} (공시)`;
  return U;
}

function card(it) {

    : isDc(it) ? [['거리·이동', routeText(it)], ['정원·현원', `${it.capacityTotal ?? U}·${it.enrolledTotal ?? U}명 (공시)`], ['통학차량', busText(it)], ['운영 상태', it.status ?? U]]
    : [['거리·이동', routeText(it)], ['구분', it.group], ['유아 과정', `${it.courses.length}개`], ['전화', it.phone ?? U]];

    <div class="row1"><button class="name" type="button" data-open="${esc(it.id)}">${esc(it.name)}</button><div class="tags">${typeTag(it)}<span class="tag">${esc(it.area)}</span></div></div>
    <div><span class="state ${cc.status === 'no' ? 'unk' : cc.status}">${cc.status === 'no' ? '해당 반 없음 · ' : ''}${esc(cc.text)}</span></div>

      <button class="btn" type="button" data-cmp="${esc(it.id)}" ${!inCmp && state.compare.length >= 4 ? 'disabled' : ''}>${inCmp ? '비교함에서 빼기' : '비교함에 담기'}</button></div>
  </article>`;
}

function emptyHelp() {
  const active = [...GROUPS.filter((g) => state.f[g.key].length).map((g) => ({ key: g.key, label: g.label })), ...CONDS.filter((c) => state.f.cond.includes(c.key)).map((c) => ({ key: c.key, label: c.label }))];
  const tips = active.map((a) => ({ ...a, n: DATA.institutions.filter((it) => passes(it, a.key)).length })).filter((a) => a.n > 0).sort((a, b) => b.n - a.n);
  return `<div class="empty"><strong>조건에 맞는 곳이 없습니다.</strong>
    ${tips.length ? `<span class="small">이 조건을 풀면 결과가 생깁니다:</span><div class="fgroup">${tips.map((t) => `<button class="btn" type="button" data-relax="${t.key}">${esc(t.label)} 풀기 → ${t.n}곳</button>`).join('')}</div>` : ''}
    ${!state.f.unknown ? '<span class="small">"미확인도 보기"를 켜면 아직 확인 못 한 곳도 함께 보입니다.</span>' : ''}</div>`;
}

function sortList(list) {
  const by = state.sort;
  return list.sort((a, b) => {
    if (by === 'dist' && state.origin) { const da = dist(a), db = dist(b); if (da !== db) return (da ?? Infinity) - (db ?? Infinity); }
    if (by === 'recruit') { const ra = childClass(a).recruit ?? -1, rb = childClass(b).recruit ?? -1; if (ra !== rb) return rb - ra; }
    if (a.kind !== b.kind) { const o = { 유치원: 0, 어린이집: 1 }; return (o[a.kind] ?? 2) - (o[b.kind] ?? 2); }
    return a.name.localeCompare(b.name, 'ko');
  });
}

  const c = `<div class="fgroup" role="group" aria-label="조건"><span class="glabel">조건</span>${CONDS.map((cd) => `<button class="chip" type="button" data-c="${cd.key}" aria-pressed="${state.f.cond.includes(cd.key)}">${esc(cd.label)}</button>`).join('')}</div>`;

function activeRule() {

const MUSTS = [

];
function monthlyCost(it) {
  const off = monthlyCostOfficial(it); const c = consultOf(it);
  if (off) { if (c?.cost && c.cost !== off.won) off.text += ` · 상담 기록 월 ${(+c.cost).toLocaleString('ko-KR')}원(다름)`; return off; }
  if (c?.cost) return { won: +c.cost, text: `월 ${(+c.cost).toLocaleString('ko-KR')}원${cTag(c)}` };
  return null;
}
/** 유치원알리미 비용 공시에서 우리 아이 나이(만3~5세)의 한 달 부담금 */
function pubCostAge(it) {
  const a = manAge(); const pc = it.pubCost;
  if (!pc || a < 3 || a > 5) return null;
  return { age: a, ...pc.byAge[a] };
}
function pubCostParts(pc) {
  const f = (n) => (n === null || n === undefined ? '미확인' : `${n.toLocaleString('ko-KR')}원`);
  return `교육과정 ${f(pc.parts.교육과정)} · 방과후 ${f(pc.parts.방과후)} · 특성화 ${f(pc.parts.특성화)}`;
}
function monthlyCostOfficial(it) {
  if (isDc(it)) return null;
  if (it.kind !== '유치원') { const c = [...it.courses].filter((x) => x.tuition).sort((a, b) => (b.minutes ?? 0) - (a.minutes ?? 0))[0]; return c ? { won: c.tuition, text: `월 ${Math.round(c.tuition).toLocaleString('ko-KR')}원 (가장 긴 과정, 등록 교습비)` } : null; }
  const pc = pubCostAge(it);
  if (pc && pc.known) return { won: pc.total, text: `월 ${pc.total.toLocaleString('ko-KR')}원 (공시 ${it.pubCost.asOf} 기준 만${pc.age}세 · ${pubCostParts(pc)}) — ${SY}년 금액은 요강·상담 확인` };
  const t = it.admission?.cost?.text; if (!t) return null;
  if (/부담금 없음|부담금 0원|무상|수익자 부담금 없음/.test(t)) return { won: 0, text: '부모 부담금 없음 (요강)' };
  const m = t.match(/월\s*([\d,]+)\s*원/); if (m) return { won: +m[1].replace(/,/g, ''), text: `월 ${m[1]}원 (요강·홈페이지 표기, 그 외 비용 확인 필요)` };
  return null;
}
function mustVal(it, key) {
  if (key === 'budget') { const b = state.reco?.budget; if (!b) return null; const c = monthlyCost(it); return c ? c.won <= b : null; }
  if (key === 'free') {
    if (isDc(it)) return null;
    if (it.kind !== '유치원') return false;
    const c = it.admission?.cost?.text;
    if (c && /부담금 없음|부담금 0원|무상|수익자 부담금 없음/.test(c)) return true;
    const pc = pubCostAge(it); if (pc && pc.known) return pc.total === 0;
    return null;
  }
  return CONDS.find((c) => c.key === key).val(it);
}
const FAMS = [

  ['low', '법정저소득층'], ['vet', '국가보훈대상'], ['nk', '북한이탈주민'], ['foreign', '외국국적 유아'],

function bestPrio(it) {
  const P = it.admission?.prio;
  if (!P) return null;
  const hits = P.filter((p) => p.keys.some((k) => state.fam.includes(k)));
  if (!hits.length) return { none: true, notes: P.filter((p) => p.note).map((p) => p.note) };
  const b = hits.sort((a, c) => a.rank - c.rank)[0];
  return { rank: b.rank, pct: b.pct, why: b.keys.filter((k) => state.fam.includes(k)).map(famLabel), notes: P.filter((p) => p.note).map((p) => p.note), others: hits.slice(1).map((h) => `${h.rank}순위`) };
}

function questions(it) {

  const out = { strength: [], comfort: [], help: [], unseen: [], sup: {} };

    if (!a) continue;
    if (a === '관찰 기회 없음') { out.unseen.push(it); continue; }
    const note = rec.notes?.[it.n] ? ` (예: ${rec.notes[it.n]})` : '';
    if (HIGH.has(a)) {
      out[it.type].push(it.hi + note);
      if (it.type !== 'strength' || it.sup === 'quiet_space') (out.sup[it.sup] ??= []).push(it.n);
    } else if (it.lo && LOW.has(a)) {
      out.help.push(it.lo + note); (out.sup[it.sup] ??= []).push(it.n);
    }
  }
  return out;

    return { value: null, text: '빈도 미확인', q: '바깥놀이·숲 활동은 일주일에 몇 번, 한 번에 얼마나 하나요?' };
  } },
  style: { label: '교육 방향 맞춤', calc(it) {

    const hit = want.filter((k) => tags.find((t) => t.key === k)?.level === '강조');
    return { value: v, text: hit.length ? `${hit.map(styleShort).join('·')} 중점${hit.length < want.length ? ` (원하는 ${want.length}개 중 ${hit.length}개)` : ''}${tags.some((t) => t.auto) ? ' · 자동 분류' : ''}` : `원하는 방향(${want.map(styleShort).join('·')})이 중점에 없음` };
  } },
  support: { label: '설문에서 고른 지원', calc(it) {
    const k = state.evalKid ?? curKid(); const rec = k?.records?.at(-1); const picks = rec?.picks ?? [];
    if (!picks.length) return { value: null, text: '설문에서 고른 지원 없음', q: null };
    const c = consultOf(it); const ans = picks.map((p) => c?.supports?.[p]).filter((x) => x in SUPPORT_V);
    if (!ans.length) return { value: null, text: `${picks.map((p) => SUPPORTS[p].name).join(', ')} — 기관 확인 전`, q: SUPPORTS[picks[0]].q };
    const v = ans.reduce((a, x) => a + SUPPORT_V[x], 0) / ans.length;
    return { value: Math.round(v * 100) / 100, text: `${picks.map((p) => `${SUPPORTS[p].name} ${c.supports[p] ?? '미확인'}`).join(', ')}${cTag(c)}` };

const tone = (v) => (v === null ? 'u' : v >= 0.7 ? 'g' : v >= 0.4 ? 'm' : 'b');

function whoList() {
  const ks = state.kids.map((k) => ({ id: k.id, label: `${k.nick} (${k.birth}년생)`, kids: [k] }));
  if (ks.length >= 2) ks.push({ id: 'family', label: '가족 전체', kids: state.kids });
  if (!ks.length) ks.push({ id: 'sample', label: `${state.birth}년생 (헤더의 출생연도)`, kids: [{ id: 'sample', nick: `${state.birth}년생`, birth: state.birth, records: [] }] });
  return ks;
}
function evalFor(it, kid) {
  state.evalKid = kid.records ? kid : null;
  return withBirth(kid.birth, () => {
    const must = state.must.map((k) => ({ k, value: mustVal(it, k) }));
    const crit = state.reco.crit.filter((c) => c.on).map((c) => ({ key: c.key, weight: WEIGHTS[c.w], w: c.w, ...CRIT[c.key].calc(it) })).filter((c) => !c.skip); // skip = 이 아이에게 해당 없는 기준(계산에서 뺌)
    return { kid, cc: childClass(it), must, mustSt: mustStatus(must), crit, score: composite(crit) };

}

function recoCard(row, rank) {

// ── 6단계: 계정별 저장 (claude.ai 계정의 비공개 공간 data/users/<본인>/state) ──
// 다른 사람(페이지 주인 포함)은 읽을 수 없음 — 플랫폼 규칙. 쓰기는 사용 중인 기기의 화면에서만, 바뀐 뒤 잠시 멈췄을 때 한 번.
const PERSIST = { birth: 'birth', origin: 'origin', compare: 'compare', sort: 'sort', filters: 'f', tab: 'tab', must: 'must', fam: 'fam', plan: 'plan', askId: 'askId', qdone: 'qdone', memo: 'memo', kids: 'kids', kidSel: 'kidSel', recSel: 'recSel', kidMode: 'kidMode', reco: 'reco', consult: 'consult', myEvents: 'myEvents', archive: 'archive', calMine: 'calMine' };

function snapshotData() { const d = {}; for (const [k, f] of Object.entries(PERSIST)) if (state[f] !== undefined) d[k] = state[f]; return d; }
function hasPersonal(d) { return !!(d.kids?.length || Object.keys(d.consult ?? {}).length || d.plan?.length || d.myEvents?.length || Object.keys(d.memo ?? {}).length || d.archive?.length); }
function applyData(d) {

}
function drawSaveState() {

}
async function cloudSave() {

  else if (el.dataset.cssup) { const id = state.askId; const c = (state.consult[id] ??= {}); (c.supports ??= {}); if (el.value) c.supports[el.dataset.cssup] = el.value; else delete c.supports[el.dataset.cssup]; if (!c.date) c.date = today(); store.set('consult', state.consult); }
  else if (el.dataset.kq) { const r = curRec(); r.answers[el.dataset.kq] = el.value; saveKids(); const p = document.getElementById('kprog'); if (p) p.textContent = `${Object.keys(r.answers).length}/24문항 답함 · 바로 저장됩니다`; }
  else if (el.dataset.pick) { const r = curRec(); const k = el.dataset.pick; r.picks = el.checked ? [...(r.picks ?? []), k] : (r.picks ?? []).filter((x) => x !== k); saveKids(); }
  else if (el.id === 'askSel') { state.askId = el.value; store.set('askId', state.askId); drawAsk(); }
  else if (el.dataset.q) { const id = state.askId; const arr = state.qdone[id] ?? []; state.qdone[id] = el.checked ? [...arr, el.dataset.q] : arr.filter((x) => x !== el.dataset.q); store.set('qdone', state.qdone); }
});
document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.dataset.kn) { const r = curRec(); (r.notes ??= {})[el.dataset.kn] = el.value; saveKids(); }
  if (el.dataset.life) { const r = curRec(); (r.life ??= {})[el.dataset.life] = el.value; saveKids(); }
});
document.addEventListener('submit', (e) => {
  if (e.target.id !== 'kidAdd') return;
  e.preventDefault();
  const nick = $('#kidNick').value.trim(); const birth = +$('#kidBirth').value;
  if (!nick || !birth) return;
  const k = { id: uid(), nick, birth, records: [] }; state.kids.push(k); state.kidSel = k.id; state.recSel = null; saveKids(); store.set('kidSel', k.id); drawKid();
});
document.addEventListener('input', (e) => { if (e.target.id === 'memo') { state.memo[state.askId] = e.target.value; store.set('memo', state.memo); } });
$('#overlay').addEventListener('click', (e) => { if (e.target.id === 'overlay') closeSheet(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#overlay').hidden) closeSheet(); });
$('#sort').value = state.sort;
$('#sort').addEventListener('change', (e) => { state.sort = e.target.value; store.set('sort', state.sort); render(); });
$('#aptList').innerHTML = (DATA.apartments ?? []).map((a) => `<option value="${esc(a.name)}${a.planned ? ' (입주 예정)' : ''} · ${esc(a.area)}"></option>`).join('');
if (state.origin?.aptId) $('#aptInput').value = state.origin.name;
$('#aptInput').addEventListener('change', (e) => {
  const v = e.target.value.replace(/ · (배방읍|탕정면)$/, '').replace(/ \(입주 예정\)$/, '');
  const a = (DATA.apartments ?? []).find((x) => x.name === v);
  if (a) setOrigin({ lat: a.lat, lng: a.lng, how: '아파트', aptId: a.id, name: a.name });
});
$('#birth').innerHTML = [SY - 6, SY - 5, SY - 4, SY - 3, SY - 2].map((y) => `<option value="${y}">${y}년생</option>`).join('');
$('#birth').value = state.birth;
$('#birth').addEventListener('change', (e) => { state.birth = +e.target.value; store.set('birth', state.birth); render(); });

// 안내·출처
const nK = DATA.institutions.filter((x) => x.kind === '유치원').length;
const nD = DATA.institutions.filter(isDc).length;
const nA = DATA.institutions.filter(isAca).length;
const nRead = DATA.institutions.filter((x) => x.admission?.read).length;
$('#notice').innerHTML = `<span><b>${SY}학년도</b> 기준</span><span>유치원 <b>${nK}곳</b>(공식 명부) · 2027 요강 확인 <b>${nRead}곳</b></span><span>영어유치원·유아 영어학원 <b>${nA}곳</b>(교육청 등록 자료)</span>${nD ? `<span>어린이집 <b>${nD}곳</b>(어린이집정보공개포털, 가정어린이집 제외)</span>` : '<span><b>어린이집은 아직 없음</b> — 인증키 승인 대기</span>'}<span>우선모집 접수 <b>11월 2일(월) 9시 ~ 4일(수) 18시</b></span>`;
$('#foot').innerHTML = `<div>유치원: 유치원알리미 공시 (확인일 ${esc(DATA.roster.checkedAt)}) · 모집요강: 각 유치원 홈페이지 원문 (확인일 ${esc(DATA.admissionCheckedAt)})</div>
  <div>영어유치원: ${esc(DATA.academySource?.name ?? U)} (${esc(DATA.academySource?.asOf ?? U)} 기준)</div>
  <div>${esc(DATA.map.source)} · 아파트 단지: ${esc(DATA.routeInfo?.aptSource ?? U)} (${esc(DATA.routeInfo?.aptCheckedAt ?? '')}) · 도보: ${esc(DATA.routeInfo?.walk ?? U)} · 자동차: ${esc(DATA.routeInfo?.car ?? U)}. 도보는 직선 ${(DATA.routeInfo?.rules?.walkMaxStraightM ?? 2500) / 1000}km, 자동차는 ${(DATA.routeInfo?.rules?.carMaxStraightM ?? 7000) / 1000}km 안쪽만 계산. 지도를 눌러 정한 출발지는 직선거리만.</div>
  <div>${esc(DATA.roster.note)} · 화면 자료 생성 ${esc(DATA.builtAt)}</div>`;
render();
showTab(state.tab);
drawSaveState();
cloudInit();
const ask = document.getElementById('askSel'); if (ask) ask.value = state.askId;
</script>
