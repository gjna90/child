<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>운영자 화면</title>
<style>
/* 운영자(관리자) 전용 화면 — 모든 일상 관리를 여기서 한다 (Supabase 콘솔에 들어가지 않아도 되게).
   자료를 막는 일은 DB 접근 규칙(RLS)이 한다: 이 화면은 공개 키만 쓰고, 관리자로 등록된 로그인 계정만 읽기·삭제가 된다. */
:root {
  --bg: #f4f6f2; --surface: #ffffff; --ink: #1d2925; --muted: #5d6b65; --line: #d6ddd7;
  --accent: #0e6a62; --accent-ink: #ffffff; --bar: #0e6a62; --track: #e6ece4;
  --warn-bg: #fff4dc; --warn-ink: #7a4b00; --ok-bg: #e2f2ea; --ok-ink: #135c3a; --danger: #b3261e; --sel: #e2f2ea;
  --font: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #141a18; --surface: #1c2421; --ink: #e8eeeb; --muted: #a3b1ab; --line: #34413c; --accent: #4fb3a8; --accent-ink: #0b1513; --bar: #4fb3a8; --track: #26302c; --warn-bg: #3a2e14; --warn-ink: #f2cf8a; --ok-bg: #173327; --ok-ink: #9fdcbc; --danger: #f2827a; --sel: #1f3a32; }
}
:root[data-theme="dark"] { --bg: #141a18; --surface: #1c2421; --ink: #e8eeeb; --muted: #a3b1ab; --line: #34413c; --accent: #4fb3a8; --accent-ink: #0b1513; --bar: #4fb3a8; --track: #26302c; --warn-bg: #3a2e14; --warn-ink: #f2cf8a; --ok-bg: #173327; --ok-ink: #9fdcbc; --danger: #f2827a; --sel: #1f3a32; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--font); }
main { max-width: 1180px; margin: 0 auto; padding: 12px 16px 40px; display: grid; gap: 12px; }
main > *, .grid2 > *, .tiles > * { min-width: 0; }
header.top { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
header.top .in { max-width: 1180px; margin: 0 auto; padding: 10px 16px 0; }
.titlebar { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
h1 { font-size: 1.15rem; margin: 0; } h2 { font-size: 1.05rem; margin: 0 0 8px; } h3 { font-size: .95rem; margin: 12px 0 4px; }
nav.tabs { display: flex; gap: 4px; overflow-x: auto; margin-top: 8px; scrollbar-width: none; }
nav.tabs button { flex: 1 0 auto; border: 0; background: none; color: var(--muted); font: inherit; font-weight: 500; padding: 10px 12px; border-bottom: 3px solid transparent; cursor: pointer; min-height: 44px; }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.grid2 { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); }
.tiles { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.tile b { display: block; font-size: 1.6rem; font-variant-numeric: tabular-nums; line-height: 1.2; }
.tile span { color: var(--muted); font-size: .85rem; }
.small { font-size: .85rem; } .muted { color: var(--muted); }
.btn { font: inherit; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; min-height: 44px; touch-action: manipulation; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { border-color: var(--danger); color: var(--danger); }
.btn.sm { min-height: 36px; padding: 5px 10px; font-size: .9rem; }
.btn:disabled { opacity: .5; cursor: default; }
input, select { font: inherit; font-size: 16px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); min-height: 44px; max-width: 100%; }
input[type=checkbox] { width: 22px; height: 22px; min-height: 0; accent-color: var(--accent); }
label.f { display: grid; gap: 4px; font-size: .85rem; color: var(--muted); }
form.stack { display: grid; gap: 10px; max-width: 380px; }
.note { padding: 10px 12px; border-radius: 10px; }
.note.warn { background: var(--warn-bg); color: var(--warn-ink); }
.note.ok { background: var(--ok-bg); color: var(--ok-ink); }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { color: var(--muted); font-weight: 500; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
td.wrap { white-space: normal; min-width: 11em; }
tr.click { cursor: pointer; } tr.click:hover { background: var(--sel); }
.bars { display: grid; gap: 6px; }
.bar { display: grid; grid-template-columns: minmax(90px, 38%) 1fr 4.2em; gap: 8px; align-items: center; font-size: .9rem; }
.bar .tr { background: var(--track); border-radius: 4px; height: 14px; position: relative; }
.bar .fl { position: absolute; inset: 0 auto 0 0; background: var(--bar); border-radius: 0 4px 4px 0; min-width: 2px; }
.bar .v { text-align: right; font-variant-numeric: tabular-nums; }
.filters { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(min(150px, 100%), 1fr)); align-items: end; }
.filters > * { min-width: 0; }
.filters select, .filters input { width: 100%; min-width: 0; }
.filterbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.filterbar input[type=search] { flex: 1 1 200px; }
.badge { display: inline-block; min-width: 1.4em; padding: 0 6px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-size: .8rem; text-align: center; }
.cards { display: grid; gap: 8px; }
.card { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; align-items: start; background: var(--surface); }
.card.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.card .body { cursor: pointer; min-width: 0; }
.card .l1 { display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; }
.card .l2 { color: var(--muted); font-size: .88rem; overflow: hidden; text-overflow: ellipsis; }
.chips span { display: inline-block; border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; margin: 2px 4px 2px 0; font-size: .85rem; }
.detail ul, .detail ol { margin: 0; padding-left: 1.2rem; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.split { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
.split .detail { position: sticky; top: 112px; max-height: calc(100vh - 124px); overflow: auto; }
.sheet-back { display: none; }
.toast { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; z-index: 30; max-width: calc(100vw - 32px); font-size: .92rem; }
details > summary { cursor: pointer; padding: 8px 0; }
@media (max-width: 760px) {
  .split { grid-template-columns: 1fr; }
  .split .detail.open { position: fixed; inset: 0; z-index: 20; max-height: none; border-radius: 0; overflow: auto; padding: 12px 16px calc(24px + env(safe-area-inset-bottom)); }
  .split .detail:not(.open) { display: none; }
  .sheet-back { display: inline-flex; }
  .bar { grid-template-columns: minmax(80px, 42%) 1fr 3.6em; }
  .hide-m { display: none; }
  th, td { padding: 8px 5px; }
  td.wrap { min-width: 7em; }
}
</style>
</head>
<body>
<header class="top"><div class="in">
  <div class="titlebar"><h1>운영자 화면 <span class="small muted">· 테스트판</span></h1><span id="who" class="small muted"></span></div>
  <nav class="tabs" id="tabs" role="tablist" hidden></nav>
</div></header>
<main id="app"><div class="panel">불러오는 중…</div></main>
<div id="toast" class="toast" role="status" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.99.3/dist/umd/supabase.min.js"></script>
<script>
const WEB = /*__WEB__*/null;
/*__LIB__*/
const $ = (s) => document.querySelector(s);
const $$ = (s) => [...document.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const KST = (d, o) => new Intl.DateTimeFormat('ko-KR', { timeZone: 'Asia/Seoul', ...o }).format(new Date(d));
const fmt = (d) => KST(d, { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false });
const ymd = (d) => new Intl.DateTimeFormat('sv-SE', { timeZone: 'Asia/Seoul' }).format(new Date(d));
const styleLabel = (k) => STYLES[k]?.short ?? k;
const supName = (k) => SUPPORTS[k]?.name ?? k;
const IDLE_MIN = 30; // 이 시간 동안 아무 조작이 없으면 자동 로그아웃
const PAGE = 50;     // 응답 목록 한 번에 보여 줄 개수
const TABS = [['sum', '한눈에'], ['rank', '희망 순위'], ['list', '응답'], ['acct', '내 계정']];

const S = { tab: 'sum', rows: [], loadedAt: null, sel: null, picked: new Set(), show: PAGE, filtOpen: false,
  f: { q: '', birth: '', obs: '', style: '', inst: '', from: '', to: '', sort: 'new' } };
let sb = null, user = null, idleTimer = null;

// ── 오류 메시지를 한국어로 ──
function koErr(e) {
  const m = String(e?.message ?? e ?? '');
  const st = e?.status ?? e?.code;
  if (/Invalid login credentials/i.test(m)) return '이메일 또는 비밀번호가 맞지 않습니다.';
  if (/Email not confirmed/i.test(m)) return '이메일 인증이 끝나지 않은 계정입니다. 계정 만들 때 자동 인증(Auto Confirm)을 켜야 합니다.';
  if (/rate limit|too many/i.test(m) || st === 429) return '짧은 시간에 너무 많이 시도했습니다. 몇 분 뒤 다시 해 주세요.';
  if (/JWT expired|invalid JWT|session.*(missing|expired)|refresh token/i.test(m) || st === 401) return '로그인 시간이 지났습니다. 다시 로그인해 주세요.';
  if (/permission denied|row-level security|not allowed/i.test(m) || st === 403 || st === '42501') return '권한이 없습니다. 관리자로 등록된 계정인지 확인해 주세요.';
  if (/Password should be at least|weak password/i.test(m)) return '비밀번호가 너무 짧거나 쉽습니다. 8자 이상, 영문·숫자를 섞어 주세요.';
  if (/same.*password|different from the old/i.test(m)) return '지금 비밀번호와 다른 비밀번호를 넣어 주세요.';
  if (/reauthentication|nonce/i.test(m)) return '보안을 위해 다시 로그인한 뒤 비밀번호를 바꿔 주세요.';
  if (/Failed to fetch|NetworkError|Load failed|network/i.test(m)) return '서버에 연결하지 못했습니다. 인터넷 연결을 확인해 주세요. 계속 안 되면 서버(Supabase 무료판)가 1주일 동안 쓰이지 않아 일시정지됐을 수 있습니다.';
  if (/timeout|timed out/i.test(m)) return '서버 응답이 늦습니다. 잠시 뒤 다시 시도해 주세요.';
  return '처리하지 못했습니다. 잠시 뒤 다시 시도해 주세요.' + (m ? ` (참고: ${m.slice(0, 80)})` : '');
}
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), 3200); }

// ── 시작·로그인 ──
async function start() {
  if (!WEB?.url) { $('#app').innerHTML = '<div class="panel note warn">아직 서버 연결 설정 전입니다. 개발 담당에게 서버 주소와 공개 키 설정을 요청하세요.</div>'; return; }
  if (!window.supabase?.createClient) { $('#app').innerHTML = '<div class="panel note warn">화면 구성 파일을 불러오지 못했습니다. 인터넷 연결을 확인하고 새로고침해 주세요.</div>'; return; }
  sb = supabase.createClient(WEB.url, WEB.key, { auth: { persistSession: true, storageKey: 'kinder-admin', autoRefreshToken: true } });
  try {
    const { data } = await sb.auth.getSession();
    if (!data?.session) return drawLogin();
    await afterLogin(data.session.user);
  } catch (e) { drawLogin(koErr(e)); }
}
function drawLogin(msg = '', ok = false) {
  user = null; $('#who').textContent = ''; $('#tabs').hidden = true; stopIdle();
  $('#app').innerHTML = `<div class="panel"><h2>관리자 로그인</h2>
    <form class="stack" id="login" novalidate>
      <label class="f">이메일<input id="em" type="email" inputmode="email" autocomplete="username" required></label>
      <label class="f">비밀번호<input id="pw" type="password" autocomplete="current-password" required></label>
      <button class="btn primary" id="loginBtn">로그인</button>
      ${msg ? `<div class="note ${ok ? 'ok' : 'warn'} small" role="alert">${esc(msg)}</div>` : ''}
      <p class="small muted" style="margin:0">관리자로 등록된 계정만 들어올 수 있습니다. 부모 이용자는 로그인하지 않습니다. 공용 컴퓨터에서는 다 쓴 뒤 꼭 로그아웃하세요.</p>
    </form></div>`;
  $('#login').onsubmit = async (e) => {
    e.preventDefault();
    const em = $('#em').value.trim(), pw = $('#pw').value;
    if (!em || !pw) return drawLogin('이메일과 비밀번호를 모두 넣어 주세요.');
    $('#loginBtn').disabled = true; $('#loginBtn').textContent = '확인 중…';
    try {
      const { data, error } = await sb.auth.signInWithPassword({ email: em, password: pw });
      if (error) return drawLogin(koErr(error));
      await afterLogin(data.user);
    } catch (err) { drawLogin(koErr(err)); }
  };
}
async function afterLogin(u) {
  user = u;
  $('#who').textContent = u.email ?? '';
  try {
    const { data: adm, error } = await sb.from('admins').select('user_id').eq('user_id', u.id).maybeSingle();
    if (error) throw error;
    if (!adm) { await sb.auth.signOut(); return drawLogin('이 계정은 관리자로 등록되어 있지 않습니다. 개발 담당에게 관리자 등록을 요청하세요.'); }
  } catch (e) { return drawLogin(koErr(e)); }
  startIdle(); drawTabs(); await load();
}
async function logout(msg = '로그아웃했습니다.', ok = true) { try { await sb.auth.signOut(); } catch { /* 이미 끊김 */ } S.rows = []; S.picked.clear(); S.sel = null; drawLogin(msg, ok); }
function startIdle() {
  const reset = () => { clearTimeout(idleTimer); idleTimer = setTimeout(() => logout(`${IDLE_MIN}분 동안 사용하지 않아 자동으로 로그아웃했습니다.`, false), IDLE_MIN * 60e3); };
  startIdle.reset = reset; ['pointerdown', 'keydown', 'scroll'].forEach((ev) => addEventListener(ev, reset, { passive: true })); reset();
}
function stopIdle() { clearTimeout(idleTimer); if (startIdle.reset) ['pointerdown', 'keydown', 'scroll'].forEach((ev) => removeEventListener(ev, startIdle.reset)); }

// ── 자료 불러오기 (서버는 한 번에 1000개까지 → 나눠서) ──
async function load(silent) {
  if (!silent) $('#app').innerHTML = '<div class="panel">응답을 불러오는 중…</div>';
  try {
    const all = [];
    for (let from = 0; from < 20000; from += 1000) {
      const { data, error } = await sb.from('submissions').select('rid,consent_ver,birth_year,observer,answers,picks,plan,reco_styles,created_at,updated_at,expires_at').order('created_at', { ascending: false }).range(from, from + 999);
      if (error) throw error;
      all.push(...data); if (data.length < 1000) break;
    }
    S.rows = all.map((r) => ({ ...r, ...derive(r) }));
    S.loadedAt = new Date();
    for (const rid of [...S.picked]) if (!S.rows.some((r) => r.rid === rid)) S.picked.delete(rid);
    if (S.sel && !S.rows.some((r) => r.rid === S.sel)) S.sel = null;
    draw();
  } catch (e) {
    const m = koErr(e);
    if (/로그인 시간이 지났/.test(m)) return logout(m, false);
    $('#app').innerHTML = `<div class="panel note warn" role="alert">응답을 불러오지 못했습니다. ${esc(m)}</div><div><button class="btn" id="retry">다시 시도</button></div>`;
    $('#retry').onclick = () => load();
  }
}
// 아이 답 → 분석 (앱과 같은 규칙: src/lib/survey.js, src/lib/profile.js)
function derive(r) {
  const an = analyze({ answers: r.answers ?? {} });
  return { an, styles: Object.keys(kidStyles(r.answers ?? {})), needs: Object.keys(an.sup) };
}

// ── 조건(필터) ──
function filtered() {
  const f = S.f, q = f.q.trim().toUpperCase();
  const out = S.rows.filter((r) => (!q || r.rid.includes(q) || r.plan.some((p) => p.name.toUpperCase().includes(q)))
    && (!f.birth || String(r.birth_year) === f.birth) && (!f.obs || r.observer === f.obs)
    && (!f.style || r.styles.includes(f.style) || r.reco_styles.includes(f.style))
    && (!f.inst || r.plan.some((p) => p.id === f.inst))
    && (!f.from || ymd(r.created_at) >= f.from) && (!f.to || ymd(r.created_at) <= f.to));
  return f.sort === 'old' ? out.reverse() : out;
}
const activeFilters = () => Object.entries(S.f).filter(([k, v]) => k !== 'sort' && v).length;
function filterUI() {
  const f = S.f, n = activeFilters();
  const births = [...new Set(S.rows.map((r) => r.birth_year))].sort();
  const insts = [...new Map(S.rows.flatMap((r) => r.plan.map((p) => [p.id, p.name])))].sort((a, b) => a[1].localeCompare(b[1], 'ko'));
  return `<div class="panel" style="display:grid;gap:10px">
    <div class="filterbar"><input type="search" id="fq" placeholder="응답번호 또는 기관 이름으로 찾기" value="${esc(f.q)}" enterkeyhint="search" aria-label="검색">
      <button class="btn" id="fopen" aria-expanded="${S.filtOpen}">조건 ${n ? `<span class="badge">${n}</span>` : ''}</button>
      ${n ? '<button class="btn" id="fclear">조건 지우기</button>' : ''}</div>
    <div class="filters" id="fbox" ${S.filtOpen ? '' : 'hidden'}>
      <label class="f">출생연도<select id="f-birth"><option value="">전체</option>${births.map((b) => `<option ${String(b) === f.birth ? 'selected' : ''}>${b}</option>`).join('')}</select></label>
      <label class="f">관찰자<select id="f-obs"><option value="">전체</option>${['부모', '교사'].map((o) => `<option ${o === f.obs ? 'selected' : ''}>${o}</option>`).join('')}</select></label>
      <label class="f">교육 방향<select id="f-style"><option value="">전체</option>${STYLE_KEYS.map((k) => `<option value="${k}" ${k === f.style ? 'selected' : ''}>${esc(STYLES[k].label)}</option>`).join('')}</select></label>
      <label class="f">지원할 기관<select id="f-inst"><option value="">전체</option>${insts.map(([id, nm]) => `<option value="${esc(id)}" ${id === f.inst ? 'selected' : ''}>${esc(nm)}</option>`).join('')}</select></label>
      <label class="f">받은 날 (부터)<input type="date" id="f-from" value="${esc(f.from)}"></label>
      <label class="f">받은 날 (까지)<input type="date" id="f-to" value="${esc(f.to)}"></label>
      <label class="f">정렬<select id="f-sort"><option value="new" ${f.sort === 'new' ? 'selected' : ''}>최근 받은 순</option><option value="old" ${f.sort === 'old' ? 'selected' : ''}>오래된 순</option></select></label>
    </div>

function draw() {

const tally = (arr) => { const m = new Map(); for (const k of arr) m.set(k, (m.get(k) ?? 0) + 1); return [...m].sort((a, b) => b[1] - a[1]); };
function bars(list, total) {

}

function rankRows(rows) {
  const inst = new Map();

  return [...inst].map(([id, o]) => ({ id, ...o, t: o.c[0] + o.c[1] + o.c[2], score: o.c[0] * 3 + o.c[1] * 2 + o.c[2] })).sort((a, b) => b.score - a.score || b.t - a.t || a.name.localeCompare(b.name, 'ko'));

// ── 동작 연결 ──
function bind() {
  const on = (sel, ev, fn) => { const el = $(sel); if (el) el.addEventListener(ev, fn); };
  on('#fq', 'input', (e) => { S.f.q = e.target.value; S.show = PAGE; clearTimeout(bind.t); bind.t = setTimeout(draw, 250); });
  on('#fopen', 'click', () => { S.filtOpen = !S.filtOpen; draw(); });
  on('#fclear', 'click', () => { S.f = { q: '', birth: '', obs: '', style: '', inst: '', from: '', to: '', sort: S.f.sort }; S.show = PAGE; draw(); });
  for (const k of ['birth', 'obs', 'style', 'inst', 'from', 'to', 'sort']) on(`#f-${k}`, 'change', (e) => { S.f[k] = e.target.value; S.show = PAGE; draw(); });
  on('#reload', 'click', () => load());
  $$('tr[data-inst]').forEach((tr) => tr.addEventListener('click', () => { S.f.inst = tr.dataset.inst; S.tab = 'list'; S.sel = null; S.show = PAGE; drawTabs(); draw(); scrollTo({ top: 0 }); }));
  on('#csvRank', 'click', () => csvRank());
  $$('[data-rid]').forEach((el) => { const open = () => { S.sel = el.dataset.rid; draw(); if (innerWidth > 760) $('#detail')?.scrollTo({ top: 0 }); }; el.addEventListener('click', open); el.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } }); });
  $$('[data-pick]').forEach((cb) => cb.addEventListener('change', () => { cb.checked ? S.picked.add(cb.dataset.pick) : S.picked.delete(cb.dataset.pick); draw(); }));
  on('#pickAll', 'change', (e) => { for (const r of filtered().slice(0, S.show)) e.target.checked ? S.picked.add(r.rid) : S.picked.delete(r.rid); draw(); });
  on('#pickNone', 'click', () => { S.picked.clear(); draw(); });
  on('#more', 'click', () => { S.show += PAGE; draw(); });
  on('#csvAll', 'click', () => csv(filtered(), activeFilters() ? '조건' : '전체'));
  on('#csvPicked', 'click', () => csv(S.rows.filter((r) => S.picked.has(r.rid)), '고른것'));
  on('#delPicked', 'click', () => askDelete([...S.picked], '#bulkAsk'));
  on('#back', 'click', () => { S.sel = null; draw(); });
  on('#delOne', 'click', () => askDelete([S.sel], '#delAsk'));
  on('#csvOne', 'click', () => csv(S.rows.filter((r) => r.rid === S.sel), S.sel));
  on('#copyOne', 'click', () => copySummary(S.rows.find((r) => r.rid === S.sel)));
  on('#logout', 'click', () => logout());
  on('#pwForm', 'submit', changePw);
}
function askDelete(rids, where) {
  const box = $(where); if (!box || !rids.length) return;
  box.innerHTML = `<div class="note warn small" role="alert">${rids.length === 1 ? `응답 ${esc(rids[0])}을(를)` : `고른 응답 ${rids.length}개를`} 지웁니다. 지우면 되돌릴 수 없습니다.
    <div class="toolbar" style="margin-top:8px"><button class="btn danger" id="delYes">네, 지웁니다</button><button class="btn" id="delNo">그만두기</button></div></div>`;
  $('#delNo').onclick = () => { box.innerHTML = ''; };
  $('#delYes').onclick = async () => {
    $('#delYes').disabled = true; $('#delYes').textContent = '지우는 중…';
    let done = 0;
    try {
      for (let i = 0; i < rids.length; i += 100) {
        const { data, error } = await sb.from('submissions').delete().in('rid', rids.slice(i, i + 100)).select('rid');
        if (error) throw error;
        done += data?.length ?? 0;
      }
      for (const rid of rids) S.picked.delete(rid);
      if (rids.includes(S.sel)) S.sel = null;
      toast(done === rids.length ? `${done}개를 지웠습니다.` : done ? `${rids.length}개 중 ${done}개를 지웠습니다. 나머지는 이미 지워졌거나 권한이 없습니다.` : '지워지지 않았습니다. 이미 지워졌거나 권한이 없습니다.');
    } catch (e) { toast(`지우지 못했습니다. ${koErr(e)}`); }
    await load(true);
  };
}
async function changePw(e) {
  e.preventDefault();
  const a = $('#pw1').value, b = $('#pw2').value, msg = $('#pwMsg');
  const say = (t, ok) => { msg.className = `note small ${ok ? 'ok' : 'warn'}`; msg.textContent = t; };
  if (a.length < 8) return say('8자 이상으로 넣어 주세요.');
  if (!/[A-Za-z]/.test(a) || !/\d/.test(a)) return say('영문과 숫자를 섞어 주세요.');
  if (a !== b) return say('두 비밀번호가 다릅니다.');
  try {
    const { error } = await sb.auth.updateUser({ password: a });
    if (error) return say(koErr(error));
    $('#pw1').value = $('#pw2').value = ''; say('비밀번호를 바꿨습니다. 다음 로그인부터 새 비밀번호를 쓰세요.', true);
  } catch (err) { say(koErr(err)); }
}

    `지원할 곳: ${r.plan.map((p, i) => `${i + 1}.${p.name}`).join(' ') || '없음'}`,
    `교육 방향(설문): ${r.styles.map(styleLabel).join(', ') || '없음'} / 부모 희망: ${r.reco_styles.map(styleLabel).join(', ') || '없음'}`,
    `잘하는 점: ${r.an.strength.join('; ') || '없음'}`, `편안한 조건: ${r.an.comfort.join('; ') || '없음'}`, `도움 필요: ${r.an.help.join('; ') || '없음'}`,
    `필요한 지원: ${r.needs.map(supName).join(', ') || '없음'} / 부모가 고름: ${r.picks.map(supName).join(', ') || '없음'}`].join('\n');
}
async function copySummary(r) {
  if (!r) return;
  try { await navigator.clipboard.writeText(summary(r)); toast('요약을 복사했습니다.'); }
  catch { toast('복사하지 못했습니다. 이 브라우저에서는 복사 권한이 막혀 있을 수 있습니다.'); }
}
// ── 내려받기 (엑셀에서 한글이 깨지지 않게 BOM, 수식으로 읽히지 않게 앞에 ' ) ──
const csvq = (v) => `"${String(v ?? '').replace(/"/g, '""').replace(/^[=+\-@\t\r]/, "'$&")}"`;
function saveCsv(head, lines, name) {
  const blob = new Blob(['﻿' + [head.map(csvq).join(','), ...lines.map((l) => l.map(csvq).join(','))].join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `${name}_${ymd(new Date())}.csv`; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast(`${lines.length}개를 내려받았습니다. 파일은 작업 후 지워 주세요.`);
}
function csv(rows, tag) {
  if (!rows.length) return toast('내려받을 응답이 없습니다.');
  const head = ['응답번호', '받은 날', '다시 보낸 날', '출생연도', '관찰자', '1지망', '2지망', '3지망', '교육 방향(설문)', '교육 방향(부모 희망)', '잘하는 점', '편안한 조건', '도움 필요', '필요한 지원(설문)', '부모가 고른 지원', '자동 삭제 예정일', ...ITEMS.map((it) => `${it.n}번 ${it.text}`)];
  saveCsv(head, rows.map((r) => [r.rid, fmt(r.created_at), r.updated_at !== r.created_at ? fmt(r.updated_at) : '', r.birth_year, r.observer, r.plan[0]?.name, r.plan[1]?.name, r.plan[2]?.name,
    r.styles.map(styleLabel).join(', '), r.reco_styles.map(styleLabel).join(', '), r.an.strength.join(' / '), r.an.comfort.join(' / '), r.an.help.join(' / '), r.needs.map(supName).join(', '), r.picks.map(supName).join(', '), ymd(r.expires_at),
    ...ITEMS.map((it) => r.answers[it.n] ?? '')]), `설문응답_${tag}`);
}
function csvRank() {
  const list = rankRows(filtered());
  if (!list.length) return toast('내려받을 희망 순위가 없습니다.');
  saveCsv(['순위', '기관', '1지망', '2지망', '3지망', '합계', '점수'], list.map((o, i) => [i + 1, o.name, ...o.c, o.t, o.score]), '희망순위');
}
addEventListener('keydown', (e) => { if (e.key === 'Escape' && S.sel && innerWidth <= 760) { S.sel = null; draw(); } });
start();
</script>
