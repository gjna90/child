# Netlify: 저장소에 올린 완성본(public/)을 그대로 올림. 빌드 명령 없음 (기관 원본 자료는 저장소에 없어서 Netlify에서 빌드할 수 없음)
# public/ 은 scripts/build-app.js 가 app/template.html 로 만든다. 주간 자동 갱신이 올리면 Netlify도 자동으로 바뀜.
[build]
  publish = "public"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/admin.html"
  [headers.values]
    Cache-Control = "no-store"
